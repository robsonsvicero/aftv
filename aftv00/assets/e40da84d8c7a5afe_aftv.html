    <script type="text/ng-template" id="/views/directives/content-card.html">
	<div ng-show="card.securityStatusCampaign === 'enabled' || !card.securityStatusCampaign">
		<a class="creator content" ng-href="/{{card.creator.username}}/contents/view/{{card.uuid}}">
			<div class="creator-image" ng-style="{'background-image': 'url({{ card.data.images[0].url | changeToHttps }})'}"></div>
			{{contentsUrls}}
			<h4>{{card.title|characters:50}}</h4>
			<div class="values">
				<span>{{card.creator.campaigns[0].name|characters:50}}</span>
			</div>
		</a>
	</div>
</script>
  
    <script type="text/ng-template" id="/views/directives/dateTime.html"><div class="date-time-picker">
  <div class="date-time-picker__fields">
    <div class="date-time-picker__date">
      <label class="date-time-picker__label" ng-class="{'date-time-picker__label--required': required}">{{dateLabel}}</label>
      <input type="text" placeholder="dd/mm/aaaa" ng-required="required" ng-model="date" class="form-control" />
    </div>
    <div class="date-time-picker__time">
      <label class="date-time-picker__label" ng-class="{'date-time-picker__label--required': required}">{{timeLabel}}</label>
      <div class="form-control-double-input">
        <input type="number" min="0" max="23" ng-required="required" placeholder="22" ng-model="hours" />
        <input type="number" min="0" max="59" ng-required="required" placeholder="45" ng-model="minutes" />
      </div>
    </div>
  </div>
</div></script>
  
    <script type="text/ng-template" id="/views/directives/passwordStrength.html"> <div class="label password-count" ng-class="password.length > 7 ? 'label-success' : 'label-danger'" ng-cloak>{{ password | passwordCount:7 }}</div>

<div class="mt-1 display-flex align-center pos-relative">
  <div class="strength-meter">
    <div class="strength-meter-fill" data-strength="{{passwordStrength}}"></div>
  </div>
  <span class="ml-2 bold strength-meter-text">{{passText}}</span>
  <span class="strength-icon">
    <i ng-if="passwordStrength < 2" class="fa fa-fw fa-times c-red"></i>
    <i ng-if="passwordStrength >= 2" class="fa fa-fw fa-check c-success"></i>
  </span>
</div>
</script>
  
    <script type="text/ng-template" id="/views/directives/search-list.html"><div class="results">
  <h4 ng-show="results.campaigns.length">Campanhas</h4>
  <ul>
    <li
      ng-repeat="item in results.campaigns"
      ng-class="{selected:item.selected}"
      ng-click="goTo(item)"
    >
      <div
        class="creator-image"
        ng-style="{'background-image': 'url({{item.about.photo | changeToHttps}})'}"
      ></div>
      <h4>{{item.name|characters:40}}</h4>
      <p>{{item.about.slogan|characters:130}}</p>
    </li>
  </ul>
</div>
</script>
  
    <script type="text/ng-template" id="/views/directives/user-card-new-home.html"><article class="pane">
  <div class="pane-flex">
    <img class="pane-img" src="{{card.about.photo | changeToHttps}}" alt="" />
    <div class="pane-text">
      <h1 class="pane-title">{{card.name|characters:50}}</h1>
      <ul
        class="pane-list"
        ng-show="!card.privateValues || !card.privateSupportersNumber"
      >
        <li ng-show="!card.privateSupportersNumber">
          <i class="fa fa-user"></i> {{card.supports.total.count}} pessoas
        </li>
        <li ng-show="!card.privateValues">
          <i class="fa fa-money"></i>
          R${{card.supports.total.value|numeral:'0,0'}}<span
            ng-show="card.fundingFrequency === 'recurring'"
            >/mês</span
          >
        </li>
      </ul>
      <p
        ng-style="{'margin-top': card.privateValues && card.privateSupportersNumber ? '1.2rem' : '0'}"
        class="pane-desc"
      >
        {{card.about.slogan|characters:130}}
      </p>
      <span class="pane-category" ng-if="card.categories.length > 0">
        <i class="fa fa-newspaper-o"></i>
        <span ng-if="card.categories.length > 1">
          <span
            class="camelcase"
            ng-repeat="category in card.categories.slice(0, -1)"
          >
            {{category}}<span ng-if="category !== card.categories.slice(-2)[0]"
              >,</span
            >
            <span
              ng-if="category === card.categories.slice(-2)[0]"
              class="lowercase"
              >e</span
            >
          </span>
        </span>
        <span class="camelcase">{{card.categories.slice(-1)[0]}}</span>
      </span>
      <a class="pane-link" ng-href="/{{card.slug}}">Explorar</a>
    </div>
  </div>
</article>
</script>
  
    <script type="text/ng-template" id="/views/directives/user-card.html"><a
  class="user-card__campaign"
  ng-href="{{campaign.slug + '?utm_source=Explore-da-APOIA-se&utm_medium=Card-de-Campanha'}}"
>
  <div
    class="user-card__campaign__avatar"
    ng-style="{'background-image': 'url({{campaign.about.photo | changeToHttps}})'}"
  ></div>
  <div class="user-card__campaign__body">
    <div class="user-card__campaign__name">{{campaign.name}}</div>
    <div class="user-card__campaign__location-and-categories">
      <div class="user-card__campaign__categories">
        {{campaign.categoriesLine}}
      </div>
    </div>
    <div class="user-card__campaign__slogan">
      {{campaign.about.slogan}}
    </div>
    <div
      class="user-card__campaign__due-date"
      ng-style="{'visibility': isCountingDown(campaign) ? 'visible' : 'hidden'}"
    >
      <svg
        class="user-card__campaign__due-date__icon"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 21"
        width="20"
        height="21"
      >
        <path
          fill="#828282"
          d="M20 4.7L15.4 1l-1.3 1.5 4.6 3.8L20 4.7zM5.9 2.4L4.6.9 0 4.7l1.3 1.5 4.6-3.8zM10.5 7H9v6l4.8 2.8.7-1.2-4-2.3V7zM10 3a9 9 0 100 18 9 9 0 000-18zm0 16a7 7 0 110-14 7 7 0 010 14z"
        />
      </svg>
      <span ng-if="getDaysRemaining(campaign) > 1">
        {{getDaysRemaining(campaign) + ' dias restantes'}}
      </span>
      <span ng-if="getDaysRemaining(campaign) == 1">
        {{getDaysRemaining(campaign) + ' dia restante'}}
      </span>
      <span ng-if="getDaysRemaining(campaign) < 1">
        Último dia!
      </span>
    </div>
    <div
      class="user-card__campaign__goal"
      ng-if="showAmountValues(campaign) && campaign.goals.length > 0"
    >
      <div class="user-card__campaign__goal__progress">
        <div class="progress-wrap">
          <div
            class="progress-bar"
            ng-style="{'width': getGoalPercentage(campaign, getNextGoal(campaign).value)+'%'}"
          ></div>
        </div>
      </div>
      <div class="user-card__campaign__goal__percentage">
        {{getGoalPercentage(campaign, getNextGoal(campaign).value)}}%
      </div>
    </div>
    <div class="user-card__campaign__bottom">
      <div class="user-card__campaign__type">
        <div ng-if="campaign.loading" class="spinner colored">
          <div class="bounce1"></div>
          <div class="bounce2"></div>
          <div></div>
        </div>
        <div

    <script type="text/ng-template" id="/views/directives/userPaymentMethods.html"><div
  ng-init="init()"
  ng-class="{empty:activePaymentMethods.length == 0, loading:loading}"
>
  <div
    ng-repeat='method in activePaymentMethods | orderBy:"method.data.cardExpirationMonth" | orderBy:"method.data.cardExpirationYear"'>
    <div class="payment-method"
      ng-class='{"selected":isMethodSelected(method), "expired": isCreditCardExpired(method), "loading":loading}'>
      <div class="clearfix">
        <div class="buttons pull-right">
          <div ng-show="!showModal && !showAskRemove">
            <span ng-show="method.type == 'barcode' && method.accrualCharge.isPrintableDocument">
              <a href="/support/barcode/{{method.accrualCharge._id}}/apoio.pdf" target="_blank" title="Imprimir boleto"
                class="btn btn-sm btn-primary" disable-after-click="2">
                <i class="fa fa-print"></i> Imprimir boleto</a> | </span>
            {{activeRecurringSupport(method.supports)}}
            <span ng-show='active.length>0'>
              <a ng-click="changeSupports()">Transferir apoios</a>
            </span>
            <span ng-show="method.type != 'barcode'">
              |
              <a ng-click="askRemove()"> Remover</a>
            </span>
          </div>
          <div ng-show="showAskRemove">
            <button class="btn-new btn-xs btn-success" type="button" ng-click="remove()">
              <strong>SIM</strong>, quero remover
            </button> |
            <a ng-click="showAskRemove=false">
              <strong>NÃO</strong>
              remover
            </a>
          </div>
        </div>

        <div class="detail-credit-card">
          <div ng-if="method.type == 'credit_card'" class='detail-credit-card-flex'>
            <div>
              <input ng-show="currentRouter !== '/profile/payment-methods' && !isCreditCardExpired(method)" type="radio"
                ng-click="selectable && selectMethod(method)" name="selectcard"
                ng-disabled="isCreditCardExpired(method)" class="select-card" />
              <div class="card-icon" ng-class="method.data.cardBrand|lowercase"></div>
              <div class="data-card">
                <strong> {{method.data.cardBrand}}</strong> final
                <strong>{{method.data.cardNumber|slice:-4}}</strong><br>
                <span class="date-register">
                  Cadastrado em {{method.createdDate|moment}}
                </span>
              </div>
               {{activeRecurringSupport(method.supports)}}
              <div class="supports-details" ng-if="(active.length >= 1) ? true : false">
                <span> Apoios vinculados: {{active.length}}
                  <span ng-show="active.length == 1">ativo</span>
                  <span ng-show="active.length >= 2 || active.length == 0">ativos</span>
                </span>
              </div>
              <div class="supports-details" ng-if="(active.length == 0) ? true : false">
                Apoios vinculados: Nenhum
              </div>
              <span ng-show="isCreditCardExpired(method)"
                class="badge badge-red font-small-3 mr-2">Vencido</span>
            </div>
            <div ng-if="!isPaymentMethodsScreen && $root.isOneTime || $root.isScheduledSupport">
              <div class="form-group" ng-if="isMethodSelected(method)">
                <select
                  ng-options="installment.numberOfInstallments as installment.label for installment in $root.installments"
                  ng-model="$root.selectedInstallment">
                </select>
              </div>
            </div>
          </div>
          <div ng-if="method.type == 'barcode'">
            <div class='detail-credit-card-flex'>
              <div>
                {{activeRecurringSupportBarcode(method.supports)}}
                <div class="data-barcode">
                  <div class="card-icon data-barcode-icon fa fa-barcode"></div>
                  Boleto bancário
                  <br>
                  <span class="date-register">
                    Vencimento: Dia {{method.dueDate || 10}} | <a ng-click="changeDueDate()">Alterar data</a>
                  </span>
                </div>
                <div class="supports-details"
                  ng-if="(activeBarcode.length >= 1) ? true : false">
                  <span> Apoios vinculados: {{activeBarcode.length}}
                    <span ng-show="activeBarcode.length == 1">ativo</span>
                    <span ng-show="activeBarcode.length >= 2 || activeBarcode.length == 0">ativos</span>
                  </span>
                </div>
                <div class="supports-details"
                  ng-if="(activeBarcode.length == 0) ? true : false">
                  Apoios vinculados: Nenhum
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div ng-show="errors.length" class="errors margin-top">
        <h3>Ocorreu um erro com a sua operação:</h3>
        <ul ng-repeat="error in errors">
          <li>* {{ error }}</li>
        </ul>
      </div>
      <div class="last-charge" ng-if="method.accrualCharge" ng-class="statusClass(method)">
        <p class="info">
          Última cobrança feita no dia
          <strong>{{method.accrualCharge.lastRetry|moment:'LLL'}}</strong> com valor de
          <strong>{{method.accrualCharge.value|numeral}}</strong>
          <strong class="status" ng-show="statusClass(method) == 'notauthorized'">não foi autorizada</strong>
          <span class="status" ng-show="statusClass(method) == 'notinitialized'">esta para ser cobrada</span>
          <span class="status" ng-show="statusClass(method) == 'initialized'">esta aguardando resposta</span>
          <span class="status" ng-show="statusClass(method) == 'captured'">foi concluida com sucesso</span>
          <strong class="status" ng-show="statusClass(method) == 'error'">não foi concluida e precisa de
            atenção</strong>
        </p>
        <div ng-show="statusClass(method) == 'notauthorized'">
          <p>
            <em>{{method.accrualCharge.acquirerFullMessage.message}} (Código
              {{method.accrualCharge.acquirerFullMessage.code}})</em>
          </p>
          <div ng-show="disableRetry">
            <b>Atenção:</b>
            <p>
              Para que o emissor de seu cartão não bloqueie o cartão você somente poderá retentar novamente daqui a 8
              horas, ok?
            </p>

            <p>Nesse meio tempo é importante que você entre em contato com o atendimento desse cartão (no verso) e peça
              para
              liberar as cobranças do APOIA.se, pedindo para adicionar o APOIA.se à lista de exceção da bandeira, para
              que
              a cobrança possa ser retentada. </p>

            <p>Depois é só você voltar aqui e retentar a cobrança. É importante que você faça isso logo depois de
              efetuar o
              desbloqueio do cartão, pois se não fizer isso em até 48h a cobrança do APOIA.se será bloqueado novamente e
              o procedimento de ligar para solicitar o desbloqueio precisará ser refeito. Infelizmente essa política é
              deles
              e não nossa.</p>
          </div>
          <button type="button" class="btn btn-new btn-primary btn-sm" ng-class="{'btn-loading':loading}"
            ng-disabled="loading || disableRetry" ng-click="retryCharge(method.accrualCharge._id)">
            <i class="fa fa-refresh"></i> Retentar no mesmo cartão
            <span count-down="method.accrualCharge.lastRetry"></span>
          </button>
          <button type="button" class="btn btn-new btn-primary btn-sm" ng-disabled="loading"
            ng-click="changeSupports({createCharge:true})">
            <i class="fa fa-credit-card"></i> Transferir e cobrar com outro cartão </button>
        </div>
        <div ng-show="statusClass(method) == 'error'">
          <p class="" ng-init="log = lastLogError(method.accrualCharge.logs)">
            Erro encontrado:
            <em>{{log.error.ErrorItem.Description}}</em>
            <br>
            <small>Entre em contato com nosso suporte.</small>
          </p>
          <button class="btn btn-new btn-primary btn-sm" ng-disabled="loading"
            ng-click="changeSupports({createCharge:true})">
            <i class="fa fa-credit-card"></i> Transferir e cobrar com outro cartão </button>
        </div>
      </div>
    </div>
  </div>

  <div ng-show="loading" class="spinner colored">
    <div class="bounce1"></div>
    <div class="bounce2"></div>
    <div></div>
  </div>

  <div class="empty-message" ng-if="activePaymentMethods.length == 0">
    <i class="fa fa-warning alert"></i> Se você optar por pagar com cartão de
    crédito você precisará cadastrar pelo menos um cartão válido para que
    possamos realizar as cobranças todo o mês. Fique tranquilo que seus dados
    estão seguros.
    <br />
    <br />
    <button
      class="btn btn-icon-left"
      type="button"
      ng-click="openFormPaymentMethod()"
    >
      <i class="fa fa-credit-card-alt"></i>
      Adicione um cartão de crédito
    </button>
  </div>
  <div class="add-payment-method">
    <div class="or">
      <span>ou</span>
    </div>
    <a
      class="btn"
      ng-click="openFormPaymentMethod()"
      ng-if="activePaymentMethods.length > 0"
    >
      adicione um novo cartão de cr&eacute;dito
    </a>
    <div
      class="or"
      ng-if="activePaymentMethods.length > 0 && paymentMethodsBarCode.length == 0 && isPaymentMethodsScreen"
    >
      <span>ou</span>
      <a class="btn" ng-click='createBarcode()'>
        adicione um boleto
      </a>
    </div>
  </div>
</div></script>

<script type="text/ng-template" id="charges">
  <h3>Cobranças feitas para {{support.campaign.name}}</h3>
  <table>
    <thead>
      <tr>
        <th>Mês</th>
        <th>Tipo</th>
        <th>Status</th>
        <th>Valor</th>
        <th>Cobrado / Vencimento</th>
      </tr>
    </thead>
    <tbody>
      <tr ng-repeat='charge in historyCharges | orderBy:"-date"' ng-class="charge.status">
        <td>
          {{charge.supports[0].accrualMonth|moment:'MMM [de] YYYY'}}
        </td>
        <td>
          <span ng-show='charge.type=="credit_card"'>
            {{charge.paymentMethod.data.cardBrand}} - {{charge.paymentMethod.data.cardNumber|slice:-4}}
          </span>
          <div ng-show='charge.type=="barcode"'>
            <div ng-if="isBarcodePendent(charge)">
              <a href="/support/barcode/{{support.lastCharge._id}}/apoio.pdf" target="_blank" title="Imprimir">
                <i class="fa fa-print"></i> {{charge.type|libTypeCharge}}
              </a>
            </div>
            <div ng-if="!isBarcodePendent(charge)">
              <span>{{charge.type|libTypeCharge}}</span>
            </div>
          </div>
        </td>
        <td style="width: 20%">
          {{charge|getStatusCharge}}
        </td>
        <td>
          {{charge.partialValue||charge.supports[0].fixedValue|numeral:'$0.00'}}
        </td>
        <td>
          <div ng-if="charge.type=='credit_card'">
            {{charge.lastModified||charge.date|moment:'DD/MM/YYYY'}}
          </div>
          <div ng-if="charge.type=='barcode'">
            {{charge.dueDate|moment:'DD/MM/YYYY'}}
          </div>

          <div ng-if="charge.chargesReference.length > 0" ng-repeat="accrualMonth in getAccrualMonths(charge, support)" class="reference">
            Referente a {{ accrualMonth }}
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</script>
</script>

          <span ng-if='support.lastCharge.paymentMethod.type === "credit_card"'><i class="fa fa-credit-card"></i> Status
            da <span ng-if="support.campaign.isRecurring">última</span> cobrança:
            <strong>{{support.lastCharge.supports.fixedValue|numeral:'$0'}}</strong></span>
          {{support.lastCharge|getStatusCharge}}
        </span>
      </div>

      <strong ng-show='support.rewardStatus && support.rewardStatus !== ""'>
        <div ng-repeat="rewardStatus in support.rewardStatus track by $index">
          <div ng-if='rewardStatus != null'>
            <i class="fa fa-gift"></i>
            <span>{{rewardStatus}}</span>
          </div>
        </div>
      </strong>

    </div>

    <!--ACOES-->
    <div class="actions">
      <a
      class="btn btn-lighter"
      href="/profile/settings/payment"
      ng-show='support.campaign.status === "closed"
      && support.charges[0].status === "ToBeRefunded"
      && support.campaign.fundingModel === "allOrNothing"'
      >Solicitar reembolso</a>
      <a ng-if="showBarcode(support)" class="btn btn-support"
        href="/support/barcode/{{support.lastCharge._id}}/apoio.pdf" target="_blank" title="Gerar boleto">Ver boleto</a>
      <feature-toggle feature-name="messages" responsible="user">
        <a ng-click="showMessagePopup(support)" ng-if='support.status !== "incomplete"' title="Mensagens"
          data-balloon="Enviar mensagem" data-balloon-pos="up" class="btn btn-lighter">
          <span class="badge badge-circle badge-messages-icon" ng-if="hasNotification(support.campaign._id)"></span>
          <i class="fa fa-comment"></i> <span class="ml-1 mobile-only mobile-only-inline-block">Enviar mensagem</span>
        </a>
      </feature-toggle>

      <a ng-click="showCharges()" ng-if="support.charges.length > 0" title="Histórico de cobranças"
        data-balloon="Histórico" data-balloon-pos="up" class="btn btn-lighter">
        <i class="fa fa-list"></i> <span class="ml-1 mobile-only mobile-only-inline-block">Histórico</span>
      </a>
      <a ng-if='supportType("blocked", support)' data-balloon="Central de Suporte" data-balloon-pos="up"
        href="https://apoiase.zendesk.com/hc/pt-br/requests/new" title="Central de Suporte" target="_blank"
        class="btn btn-primary">
        Central de Suporte
      </a>
    </div>

  </div>
  <div class="empty" ng-if="supportsOneTime.length == 0 && loading == false">
    <snall>Nenhum apoio.</snall>
  </div>

  <div ng-show="loading" class="spinner colored">
    <div class="bounce1"></div>
    <div class="bounce2"></div>
    <div></div>
  </div>

</div>
</br>
</script>

    <script type="text/ng-template" id="/views/directives/paymentMethods/form.html"><form name="Support" novalidate ng-submit="submit()" ng-class="{'submiting':submiting}">
  <h3>Cadastre um novo cartão</h3>
  <em ng-show="pendenciesWarnings">Para remover este cartão é necessário que você liquide as cobranças pendentes ou as transfira para outra forma de pagamento.</br></br>Caso não haja nada pendente e você apenas quer deixar de apoiar e receber novas cobranças daqui para frente, primeiro desative <span ng-show='method.supports.length>1'>suas promessas</span><span ng-show='method.supports.length==1'>sua promessa</span> de apoio.
  <hr>
  </em>
  <div class="form-group mb-1">
    <label for="cardHolderName">
      Nome impresso no cartão
      <small>O seu nome deve estar escrito da mesma forma que aparece no cartão</small>
    </label>
    <div class="input-group">
      <input no-accent class="form-control" id="cardHolderName" name="cardHolderName" ng-disabled="submiting" ng-model="data.cardHolderName" required type="text">
      <span class="message error" ng-show="showError('cardHolderName','required')">Nome é obrigatório</span>
      <span class="message error" ng-show="showError('cardHolderName','noAccent')">Acentos não são permitidos</span>
    </div>
  </div>

  <div class="form-group mb-1">
    <div ng-show="!imForeign">
      <label for="cpfCnpj">
        CPF/CNPJ
      </label>
      <div class="input-group">
        <input class="form-control" id="cpfCnpj" name="cpfCnpj" ng-disabled="submiting" ng-model="data.cpfCnpj" ng-required="!imForeign" ui-br-cpfcnpj-mask type="text">
        <span class="message error" ng-show="showError('cpfCnpj','required')">Insira seu CPF ou CNPJ</span>
        <span class="message error" ng-show="showError('cpfCnpj','cpf')">CPF inválido</span>
        <span class="message error" ng-show="showError('cpfCnpj','cnpj')">CNPJ inválido</span>
      </div>
    </div>
    <div ng-show="imForeign" class="grid">
      <div class="grid__col grid__col--5-of-8">
        <label for="foreignDocument">
          Documento
        </label>
        <div class="input-group">
          <input class="form-control" id="foreignDocument" name="foreignDocument" ng-model="data.foreignDocument" type="text" ng-required="imForeign"
            data-hj-whitelist>
          <span class="message error" ng-show="showError('foreignDocument','required')">Insira um Documento</span>
        </div>
      </div>
      <div class="grid__col grid__col--3-of-8">
        <label for="foreignDocumentType">
          Tipo
        </label>
        <div class="input-group">
          <select id="foreignDocumentType" name="foreignDocumentType" ng-model="data.foreignDocumentType" ng-required="imForeign">
            <option value="taxpayer">Taxpayer Identification Number</option>
          </select>
          <span class="message error" ng-show="showError('foreignDocumentType','required')">Qual tipo do documento</span>
        </div>
      </div>
    </div>
    <small>
      <label>
        <input type="checkbox" ng-model="imForeign" ng-click="data.cpfCnpj=''"> Sou estrangeiro e não tenho CPF.
      </label>
    </small>
  </div>
  <div class="form-group mb-1">
    <label for="cardNumber">Número do cartão</label>
    <div class="input-group">
      <span class="moneyMask">
        <i class="fa fa-lock"></i>
      </span>
      <input class="form-control card-number" id="cardNumber" name="cardNumber" required maxlength="{{creditCardRules.length|max}}" minlength="13" ng-disabled="submiting" ng-model="data.cardNumber" type="phone" card-number>
      <span class="message error" ng-show="showError('cardNumber','cardNumber')">O numero do cartão não é válido.</span>
      <span class="message error" ng-show="showError('cardNumber','required')">O numero do cartão é obrigatório.</span>
      <span class="message error" ng-show="showError('cardNumber','minlength')">O numero do cartão está incompleto.</span>
      <span class="message error" ng-show="showError('cardNumber','maxlength')">Tem mais numero do que o esperado para seu cartao de crédito</span>
      <span class="card-icon overlayed" ng-class="creditCardRules.type"></span>
    </div>

    <label class="error">Número do cartão de crédito inválido</label>
    <div class="clearfix">
      <button type="button" class="font-small-1 border-0 p-0 px-1 pull-right mb-1" ng-if="brandFix" ng-click="brandSelect=!brandSelect">Sua bandeira não é esta? Corrija aqui!</button>
    </div>
  </div>

  <div class="form-group mb-1" ng-show="brandSelect">
    <label for="cardBrandFix">Selecione a bandeira correta</label>
    <div class="input-group">
      <select name="cardBrandFix" id="cardBrandFix" ng-model="data.cardBrandFix">
        <option value="">Selecione</option>
        <option value="Visa">Visa</option>
        <option value="Mastercard">Mastercard</option>
        <option value="Elo">Elo</option>
        <option value="Amex">American Express</option>
        <option value="Diners">Diners</option>
        <option value="Aura">Aura</option>
        <option value="Discover">Discovery</option>
      </select>
    </div>
  </div>

  <div class="form-group mb-1 grid">
    <div class="grid__col grid__col--2-of-3 mb-2">
      <label for="cardMonth">Validade (MM/AAAA)
        <span class="message message-inline error" ng-show="!showError('cardExpirationMonth','creditcardExpired') && (showError('cardExpirationYear') || showError('cardExpirationMonth'))">Data de validade incorreta</span>
        <span class="message message-inline error" ng-show="showError('cardExpirationMonth','creditcardExpired')">Este cartão expirou</span>
      </label>
      <div class="clearfix">
        <div class="half month-wrap">
          <input class="form-control" name="cardExpirationMonth" id="cardExpirationMonth" ng-disabled="submiting" ng-model="data.cardExpirationMonth" required type="number" max="12" min="1" placeholder="MM" />
        </div>
        <div class="half year-wrap">
          <input class="form-control" name="cardExpirationYear" id="cardExpirationYear" ng-disabled="submiting" ng-model="data.cardExpirationYear" required type="number" max="{{minExpirationYear+20}}" min="{{minExpirationYear}}" placeholder="AAAA"/>
        </div>
      </div>
    </div>
    <div class="grid__col grid__col--1-of-3">
      <label for="cardSecurityNumber">CVV</label>
      <div class="input-group">
        <input class="form-control" id="cardSecurityNumber" minlength="{{creditCardRules.cvcLength|min}}" maxlength="{{creditCardRules.cvcLength|max}}" name="securityCode" ng-disabled="submiting" ng-model="data.cardCVV" ng-pattern="/^[0-9]+$/" required placeholder="123" type="text">
        <span class="card-icon cvv overlayed"></span>
        <span class="message error" ng-show="showError('securityCode','required')">Obrigatório</span>
        <span class="message error" ng-show="showError('securityCode','minlength')">Minimo
          {{creditCardRules.cvcLength|min}}
          números</span>
        <span class="message error" ng-show="showError('securityCode','maxlength')">Máximo
          {{creditCardRules.cvcLength|max}}
          números</span>
      </div>
    </div>
  </div>

  <div class="errors" ng-show="errors.length > 0">
    <ul>
      <li ng-repeat="erro in errors">
        {{erro|translateError}}
      </li>
    </ul>
  </div>
  <div class="message-warning" ng-if="Support.$submitted && warningExpirationCreditcard">
    Este cartão está prestes a expirar e para evitar que você tenha que substituí-lo em breve sugerimos que você utilize um outro cartão que seja válido por mais tempo. <br> Obrigado.
  </div>
  <div class="text-center">
    <button ng-click="next()" type="button" ng-disabled="Support.$invalid" class="btn-new btn-primary btn-success btn-wide bold">Prosseguir</button>
  </div>
</form>
</script>

    <script type="text/ng-template" id="/views/directives/paymentMethods/supportsTransfer.html"><div>
  <h3>Transfira seus apoios</h3>

  </br>

  <label ng-if="dataSupports.pendenciesWarnings">
    Esta forma de pagamento está sendo utilizada para
    <span ng-show='method.supports.length > 1'>os apoios</span>
    <span ng-show='method.supports.length == 1'>o apoio</span> abaixo:
  </label>

  <label ng-show="!dataSupports.pendenciesWarnings">Promessas de apoio ativas:</label>

  {{recurringSupport(method.supports)}}
  <ul>
    <li ng-repeat="support in recurringSupports" ng-class="{disabled: !support.active}">
      <span class="support">{{support.populatedCampaign.name}} - {{support.fixedValue|numeral:'$0'}}</span>
      <span ng-show="!support.active">(apoio desativado)</span>
    </li>
  </ul>

  <label ng-if="dataSupports.pendenciesWarnings">
    Para remover o cartão é necessário que você liquide as cobranças ou as transfira para outra forma de pagamento.
  </label>

  <div class="text-center" ng-show="activePaymentMethods.length <= 1">
    <a class="btn btn-new btn-success" ng-click='openFormPaymentMethod() || closeThisDialog()'>
      <i class="fa fa-credit-card"></i> Adicionar nova forma de pagamento</a>
  </div>

  <p class="field" ng-show="activePaymentMethods.length > 1">
    <label>
      <select ng-model="newPaymentMethod" ng-disabled="loading">
        <option value="">Selecione uma forma de pagamento</option>
        <option ng-value="option._id" ng-repeat='option in activePaymentMethods | filter:{_id:"!"+method._id}'>
          {{optionPaymentMethod(option.type, option.data)}}
        </option>
      </select>
    </label>
  </p>

      </tr>
      <tr>
        <td ng-bind-html="barcodeCostTable.newCharge.date"></td>
        <td>{{ barcodeCostTable.newCharge.value | numeral:'$0.00' }}</td>
      </tr>
      <tr>
        <td>Taxa do boleto</td>
        <td>{{ barcodeCostTable.barcodeTax | numeral:'$0.00' }}</td>
      </tr>
      <tfoot>
        <tr class="bold">
          <td>Total</td>
          <td>{{ barcodeCostTable.total | numeral:'$0.00' }}</td>
        </tr>
      </tfoot>
    </table>

    <span ng-show='method.supports.length > 1'>suas promessas</span>

  </em>

  <div>
    <button type="button" class="btn btn-new btn-success" ng-class="{'btn-loading':loading}" ng-disabled="loading" ng-click="confirm()">Transferir</button> ou
    <a ng-click='!loading && openFormPaymentMethod() || closeThisDialog()' ng-disabled="loading">Adicionar nova</a> ou
    <a ng-click='!loading && closeThisDialog()'>Cancelar</a>
  </div>
</div>

    <script type="text/ng-template" id="/views/directives/supports/stepPaymentMethod.html"><div id="payment-method-section">
    <!-- Se já tem um cartão de crédito cadastrado -->
  <div class="payment-step step-edit" ng-show="support.paymentMethod && !newCard && !isNewSupport(support)">

    <!-- Se já tem um apoio com o tipo credit_card -->
    <div class="newCard" ng-show="support.paymentMethod.type === 'credit_card'">
      <div class="cell halfWidth">
        Este apoio está vinculado ao cartão
        <span class="primaryColor">{{support.paymentMethod.data.cardBrand}}</span> de número
        <span class="primaryColor">**** **** **** {{support.paymentMethod.data.cardNumber}}
        </span>
      </div>
    </div>

    <button class="btn btn-primary" id="useAnotherCard" ng-click="newCard = true" type="button">
      <i class="fa fa-refresh"></i>
      Alterar a forma de pagamento
    </button>
  </div>

  <!-- Não tem método de pagamento ou tem um cartão novo -->
  <div ng-show="!support.paymentMethod || isNewSupport(support) || newCard">
    <div class="payment-step step-method">

      <div class="step-title">
        <h3>2. Forma de pagamento</h3>
        <small ng-if="!isNewSupport(support)">Passo 2 de 2</small>
        <small ng-if="isNewSupport(support)">Passo 2 de 3</small>
      </div>

      <em>
        <i class="fa fa-lock"></i>
        PAGAMENTO SEGURO
      </em>

      <br>

      <div class="tabs">
        <button type="button" class="tab tab-button" ng-class="{'active':paymentMethodType=='credit_card'}" ng-click="paymentMethodType='credit_card'">
          <i class="fa fa-credit-card"></i>
          <em>Cartão de crédito</em>
        </button>
        <button type="button" ng-show="showPaymentMethodBarcode()" ng-disabled="imForeign" class="tab tab-button" ng-class="{'active':paymentMethodType=='barcode'}" ng-click="paymentMethodType='barcode'">
          <i class="fa fa-barcode"></i>
          <em>Boleto bancário</em>
          <small ng-if="imForeign">Disponível somente com CPF/CNPJ</small>
        </button>
      </div>

      <!-- Cartão de Crédito -->
      <div class="tab-content" ng-if="paymentMethodType == 'credit_card'">
        <div class="form-group payment-methods-validation">
          <input type="hidden" ng-model="data.paymentMethodId" id="paymentMethodId" name="paymentMethodId" required/>
          <span class="message error message-inline" ng-show="showError('paymentMethodId','required')">Selecione uma das formas de pagamento</span>
        </div>
        <user-payment-methods filter-type="credit_card" selectable=true></user-payment-methods>

      </div>

      <!-- Boleto -->
      <div class="tab-content" ng-if="paymentMethodType == 'barcode'">
        <div>
          <p>
            Cada boleto bancário tem um custo de R$2.
          </p>
          <p ng-if="openChargesCreatedThisMonth.length > 0 || isNewSupport(support)"><strong>
            <b>Vencimento do boleto: {{dueDate}}</b>
          </strong></p><br>
          <h4 class="rewards-barcode" ng-if="data.reward && data.reward.limitedNumber"><b>Sua recompensa só está garantida até o vencimento do boleto.</b></h4>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE SUPPORT - UNPAID - WITHOUT INCREASED -->
  <div class="warning" ng-if="openChargesCreatedThisMonth.length > 0 && !increaseValue && !isNewSupport(support)">
    <h3>Atenção!</h3>
    <div ng-repeat="charge in openChargesCreatedThisMonth">
      <p>Você tem uma cobrança deste mês em aberto no valor total de {{charge.value|numeral}}, para as seguintes campanhas:</p>
      <div class="panel">
        <div ng-repeat="support in charge.supports">
          Apoio de {{support.fixedValue|numeral}} para
          <a ui-sref="userMain({username:'{{support.dest.username}}'})">{{support.dest.pageName}}</a>
        </div>
      </div>
      <!-- UPDATE PAYMENTMETHOD -->
      <div ng-if="changedPaymentMethod">
        <p>Esta cobrança será transferida para o novo método de pagamento selecionado e cobrada instantaneamente.</p>
        <div ng-show="charge.supports.length > 1">
          <div class="inline-input">
            <label>
              <input type="checkbox" id="updateSupport" name="updateSupport" ng-model="data.updateSupports" ng-disabled="disable()"> Desejo transferir todos estes apoios para o novo método de pagamento selecionado.
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE SUPPORT - INCREASEVALUE -->
  <div class="warning" ng-if="increaseValue && campaign.fundingFrequency !== 'oneTime' && !showScheduledSupport(support)">
    <h3>Eba! Parece que você está aumentando seu apoio!</h3>
    <!-- PAID CHARGE - CHARGEMODE UPFRONT -->
    <div ng-if="chargesCreatedThisMonth.length > 0 && openChargesCreatedThisMonthForSupport.length === 0 && originalChargeMode === 'upFront'">
      <h4 class="font-medium-1 mb-2">O que você quer fazer?</h4>
        <p>
          <label class="font-normal">
            <input type="radio" name="payNextMonth" ng-model="data.payNextMonth" value="false" />
            <strong>Atualizar apoio agora: </strong>será gerado uma cobrança complementar de {{complementaryValue|numeral}} e o novo valor passará a valer já para este mês.
          </label>
      </p>
      <p>
        <label class="font-normal">
          <input type="radio" name="payNextMonth" ng-model="data.payNextMonth" value="true" />
          <strong>Atualizar apoio no próximo mês: </strong>não será gerada nenhuma cobrança agora e o novo valor escolhido passa a valer somente no próximo mês.
        </label>
      </p>
    </div>
    <!-- PAID - AND CHARGEMODE POSTPAID -->
    <div ng-if="(openChargesCreatedThisMonthForSupport.length === 0 && originalChargeMode === 'postPaid') || (neverChargesCreated && originalChargeMode === 'postPaid')">
      <p>Não será gerada nenhuma cobrança agora e o novo valor escolhido passa a valer este mês.</p>
    </div>
    <!-- UNPAID CHARGE - CHARGEMODE UPFRONT -->
    <div ng-if="openChargesCreatedThisMonthForSupport.length > 0 && originalChargeMode === 'upFront'">
      <h4 class="font-medium-1 mb-2">Você tem cobrança(s) em aberto dessa campanha no valor de {{openValueToCampaign|numeral}}.</h4>
      <p>Será gerado uma cobrança complementar de {{complementaryValue|numeral}} + valor em aberto de {{openValueToCampaign|numeral}}.</p>
    </div>
    <!-- UNPAID - OR NEVER CHARGE CREATED - AND CHARGEMODE POSTPAID -->
    <div ng-if="openChargesCreatedThisMonthForSupport.length > 0 && originalChargeMode === 'postPaid'">
      <p>Não será gerada nenhuma cobrança agora e o novo valor escolhido passa a valer somente no próximo mês.</p>
    </div>
  </div>
</div>
</script>

    <script type="text/ng-template" id="/views/directives/user/textAngularUpload.html"><div class="modal-upload">

    <label for="files">
      <h3 >Escolha a imagem para fazer o upload</h3>
      <small>Tamanho máximo permitido de 5MB.</small>

        <button class="btn mt-2" ng-click="cancel()">Cancelar</button>

</div>
</script>

      <select ng-model="address.country">
        <option value="{{country}}" ng-repeat="country in countries | orderBy:'name'">{{country}}</option>
      </select>
    </div>
  </div>
</div>

<div class="form-group" ng-if="!outOfBrazil">
  <label for="address-postal-code-{{identifier}}" class="required">
      CEP
  </label>
  <small>Código postal para localização do seu endereço</small>
  <div class="grid">
    <div class="input-group grid__col grid__col--3-of-8">
      <input class="form-control" id="address-postal-code-{{identifier}}" name="addressPostalcode{{identifier}}" ng-pattern="/^(?!00000-000$)\d{5}-\d{3}$/" ng-model="address.postalcode" require type="text" ng-required="addressRequired" ng-disabled="disable()" placeholder="00000-000" ui-get-cep ui-br-cep-mask data-hj-whitelist></input>
      <span class="message error" ng-show="showError('addressPostalcode{{identifier}}','required')">CEP Incompleto</span>
      <span class="message error" ng-show="showError('addressPostalcode{{identifier}}','cep')">CEP inválido</span>
    </div>
  </div>
</div>

<div class="form-group" ng-if="outOfBrazil">
  <label for="posta-code-{{address._id | limitTo: 3}}">
      Código Postal
  </label>
  <span class="message error message-inline" ng-show="showError('addressPostalcode','required')">Incompleto</span>
  <div class="grid">
    <div class="input-group grid__col grid__col--3-of-8">
      <input class="form-control" id="posta-code-{{address._id | limitTo: 3}}" name="addressPostalcode" ng-model="address.postalcode" require type="text" ng-required="addressRequired" ng-disabled="disable()" data-hj-whitelist></input>
      <small>Código postal para localização do seu endereço</small>
    </div>
  </div>
</div>

<div class="grid">
  <div class="grid__col grid__col--4-of-8">
    <div class="form-group">
      <label for="address-street-{{identifier}}" class="required">
        Rua/Av
      </label>
      <div class="input-group">
        <input type="text" id="address-street-{{identifier}}" name="addressStreet{{identifier}}" ng-model="address.street" ng-required="addressRequired" data-hj-whitelist>
        <span class="message error" ng-show="showError('addressStreet{{identifier}}','required')">Rua é obrigatório</span>
      </div>
      <small>Rua, Av, Travessa, Largo ...</small>
    </div>
  </div>

  <div class="grid__col grid__col--2-of-8">
    <div class="form-group">
      <label for="address-number-{{identifier}}" class="required">
        N&uacute;mero
      </label>
      <div class="input-group">
        <input type="text" name="addressNumber{{identifier}}" id="address-number-{{identifier}}" ng-model="address.number" ng-required="addressRequired" data-hj-whitelist>
        <span class="message error" ng-show="showError('addressNumber{{identifier}}','required')">Obrigatório</span>
      </div>
    </div>
  </div>

  <div class="grid__col grid__col--2-of-8">
    <div class="form-group">
      <label for="address-complement">Complemento</label>
      <input type="text" name="addressComplement" id="address-complement" ng-model="address.complement" data-hj-whitelist>
    </div>
  </div>
</div>

<div class="grid">
  <div class="grid__col" ng-cloak ng-class="{'grid__col--2-of-6':outOfBrazil,'grid__col--3-of-8':!outOfBrazil}">
    <div class="form-group">
      <label for="address-neighborhood-{{identifier}}" class="required">

      </label>
      <div class="input-group">
        <input type="text" name="addressNeighborhood{{identifier}}" id="address-neighborhood-{{identifier}}" ng-model="address.neighborhood" ng-required="addressRequired" data-hj-whitelist>
        <span class="message error" ng-show="showError('addressNeighborhood{{identifier}}','required')">Bairro é obrigatório</span>
      </div>

  <div class="grid__col" ng-cloak ng-class="{'grid__col--2-of-6':outOfBrazil,'grid__col--3-of-8':!outOfBrazil}">

      </label>
      <div class="input-group">

        <span class="message error" ng-show="showError('addressCity{{identifier}}','required')">Cidade é obrigatório</span>
        <!-- <small>Nos buscamos a cidade atavés do seu CEP verifique se é ele que está errado</small> -->

  <div class="grid__col grid__col--2-of-8" ng-if="!outOfBrazil">
    <div class="form-group">
      <label for="address-state-{{identifier}}" class="required">
        UF
      </label>
      <div class="input-group">
      <select name="addressState{{identifier}}" ng-model="address.state" ng-required="addressRequired && !outOfBrazil">
          <option value="">--</option>  
          <option value="AC">AC</option>
          <option value="AL">AL</option>
          <option value="AP">AP</option>
          <option value="AM">AM</option>
          <option value="BA">BA</option>
          <option value="CE">CE</option>
          <option value="DF">DF</option>
          <option value="ES">ES</option>
          <option value="GO">GO</option>
          <option value="MA">MA</option>
          <option value="MT">MT</option>
          <option value="MS">MS</option>
          <option value="MG">MG</option>
          <option value="PA">PA</option>
          <option value="PB">PB</option>
          <option value="PR">PR</option>
          <option value="PE">PE</option>
          <option value="PI">PI</option>
          <option value="RJ">RJ</option>
          <option value="RN">RN</option>
          <option value="RS">RS</option>
          <option value="RO">RO</option>
          <option value="RR">RR</option>
          <option value="SC">SC</option>
          <option value="SP">SP</option>
          <option value="SE">SE</option>
          <option value="TO">TO</option>
        </select>
        <!--<input type="text" name="addressState{{identifier}}" id="address-state-{{identifier}}" max-length="2" min-length="2" ng-pattern="stateValidate" ng-model="address.state" ng-required="addressRequired && !outOfBrazil" data-hj-whitelist>-->
        <span class="message error" ng-show="showError('addressState{{identifier}}','required')">UF inválido</span>
      </div>

  <div class="grid__col grid__col--2-of-6" ng-if="outOfBrazil">
    <div class="form-group">
      <label for="address-state-{{identifier}}">Estado</label>

        <input type="text" name="addressState{{identifier}}" id="address-state-{{identifier}}" ng-model="address.state" ng-pattern="false" data-hj-whitelist>

    <script type="text/ng-template" id="/views/directives/user/campaign/about.html"><form name="Form" novalidate ng-submit="submit()" method="post" enctype="multipart/form-data">
  <div class="form-group" ng-if="data.campaign.fundingFrequency === 'recurring' ">
    <label for="campaignType">
      Qual tipo de apoio financeiro contínuo você prefere receber?
    </label>
    <div class="input-group">
      <div class="inline-input">
        <label>
          <input type="radio" id="campaignType_corrente" name="campaignType" value="monthly" ng-model="data.campaign.fundingModel" ng-disabled="disable() || campaignHasSupports"> Por MÊS
          <small>
            Seus apoiadores serão cobrados no momento do apoio e posteriormente no início de cada mês.
          </small>
        </label>
      </div>
      <div class="inline-input">
        <label>
          <span ng-class='{"muted": !allowPerContent()}'><input type="radio" id="campaignType_perContent" name="campaignType" value="perContent" ng-model="data.campaign.fundingModel" ng-disabled="!allowPerContent()"> Por CRIAÇÃO</span>
          <small>
            Seus apoiadores(as) serão cobrados apenas se você fizer uma publicação marcada como paga em seu mural de campanha. Você pode fazer várias publicações marcadas como pagas por mês, embora alguns dos seus apoiadores(as) tenham um limite sobre quantas publicações eles apoiarão. As cobranças referentes às publicações marcadas como paga são efetuadas sempre no mês seguinte.
          </small>
        </label>
      </div>
    </div>
  </div>
  <div class="form-group">
    <label for="campaignName">
      O nome da sua campanha:
      <small>O nome deve conter no máximo {{nameMaxLength}} caracteres</small>
    </label>
    <div class="input-group">
      <input class="form-control" ng-maxlength="nameMaxLength" id="campaignName" name="campaignName" ng-model="data.campaign.name" require type="text" required ng-disabled="disable()"></input>
      <span class="message error message-inline" ng-show="showError('campaignName','required')">O seu projeto precisa ter um nome</span>
      <span class="message error message-inline" ng-show="showError('campaignName','maxlength')">Seu nome deve ter no máximo {{nameMaxLength}}</span>
    </div>
  </div>

  <div class="form-group">
    <label for="campaignSlogan">
      Frase de efeito
      <small>No máximo 100 caracteres. Exemplo: "Jazz para quem não tem paciência"</small>
    </label>
    <div class="input-group">
      <input class="form-control" id="campaignSlogan" name="campaignSlogan" ng-model="data.campaign.about.slogan" require type="text" required ng-disabled="disable()"></input>
      <span class="message error message-inline" ng-show="showError('campaignSlogan','required')">Precisamos desta informação</span>
    </div>
  </div>

  <div class="form-group">
    <label for="aboutWhat">
      O que você está criando?
      <small>Este texto serve para informar em pouquíssimas palavras (uma ou duas) qual é o fruto do seu trabalho. Por exemplo:
        Músicas, Videos, Arte, etc</small>
    </label>
    <div class="grid">
      <div class="input-group grid__col grid__col--1-of-2">
        <input class="form-control" id="aboutWhat" ng-required="data.campaign.fundingModel === 'perContent'" name="aboutWhat" ng-model="data.campaign.about.what" type="text" ng-disabled="disable()"></input>
        <span class="message error message-inline" ng-show="showError('aboutWhat','required')">Este campo é obrigatório.</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="campaignWithSocialImpact">
      Impacto Social
      <small>Marque abaixo se a finalidade desta campanha é causar algum tipo de Impacto Social positivo.</small>
    </label>
    <div class="grid">
      <div class="input-group grid__col grid__col--1-of-2">
        <input type="checkbox" id="campaignWithSocialImpact" name="campaignWithSocialImpact" ng-model="data.campaign.campaignWithSocialImpact" ng-disabled="disable()"> Marque se esta iniciativa tem Impacto Social positivo
      </div>
    </div>
  </div>


  <div class="form-group">
    <label for="username">
      URL personalizada da página de seu projeto na APOIA.se:
      <small field-helper>A URL que você cadastrar aqui precisa ser toda em letras minúsculas e sem espaços. Pense em algo fácil para que as pessoas possam
        entender facilmente e lembrar de como escrever quando quiserem acessar. </small>
    </label>
    <div class="input-group">
      <div class="input-prefix">
        <span>https://apoia.se/</span>
      </div>
      <input class="form-control half" id="username" name="username" ng-model="data.campaign.slug" require type="text" placeholder="sem espaços" required ng-disabled="disable()" minlength=3 uniq-username />
      <span class="message error message-inline" ng-show="showError('username','required')">A sua campanha precisa ter uma URL</span>
      <span class="message error message-inline" ng-show="showError('username','minlength')">Precisa ter no mínimo 3 letras</span>
      <span class="message error message-inline" ng-show="showError('username','alreadyExists')">Este nome ja é utilizado :( .Por favor escolha um outro</span>
    </div>
  </div>

  <div class="mb-3">
    <label for="file">
      Imagem de perfil
      <small>Tamanho máximo permitido de 5MB. Arquivos permitidos: .jpg .png .jpeg .gif</small>
      <small>Dimensão ideal: 230x320</small>
    </label>

    <div class="p-5">
      <div class="form-group">
        <button class="btn" ngf-select ng-model="campaignPhoto" name="file" ngf-pattern="'image/*'" ngf-accept="'image/*'" ngf-max-size="5MB" ngf-model-options="{debounce:100}">
          Selecione o arquivo
        </button>

        <div class="preview-about">
          <img ngf-src="campaignPhoto">
        </div>

        <span class="message error message-inline" ng-show="showError('file','maxSize')">Tamanho máximo permitido de 5MB</span>
        <span class="message error message-inline" ng-show="showError('file','pattern')">Tipo de arquivo inválido. Permitido: jpeg, jpg, png e gif</span>
      </div>
    </div>
  </div>

  <div class="mb-3">
    <label for="file">
      Imagem de capa da campanha
      <small>Tamanho máximo permitido de 5MB. Arquivos permitidos: .jpg .png .jpeg .gif</small>
      <small>Dimensão ideal: 1600x300</small>
    </label>

    <div class="p-5">
      <div class="form-group">
        <button class="btn" ngf-select ng-model="campaignCover" name="file" ngf-pattern="'image/*'" ngf-accept="'image/*'" ngf-max-size="5MB" ngf-model-options="{debounce:100}">
          Selecione o arquivo
        </button>

        <div class="preview-about">
          <!-- <img ngf-src="campaignCover"> -->
          <div class="preview-about__cover" ngf-background="campaignCover" ng-style='{
              "display": !!campaignCover ? "" : "none"
            }'></div>
        </div>
        <span class="message error message-inline" ng-show="showError('file','maxSize')">Tamanho máximo permitido de 5MB</span>
        <span class="message error message-inline" ng-show="showError('file','pattern')">Tipo de arquivo inválido. Permitido: jpeg, jpg, png e gif</span>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label for="social">
      Redes sociais:
      <small>Liste-as e ponha a URL</small>
    </label>
    <div class="input-group social-links" ng-repeat="link in data.campaign.social">
      <div class="input-prefix">
        <i class="fa fa-{{link.type||'link'}}"></i>
      </div>
      <input class="form-control half" id="social_{{$index}}" name="social_{{$index}}" ng-model="link.url" require type="text" required ng-disabled="disable()" link-type></input>
      <input type="hidden" ng-model="link.type">
      <a ng-click="deleteSocialLink()"> Remover </a>
      <span class="message error message-inline" ng-show="showError('social_'+$index)">Link inválido</span>
    </div>
  </div>

  <button type="button" class="btn btn-new next" ng-click="pushSocialLink()">Adicionar link de redes sociais</button>
  
  <div style="margin-top: 2em;" class="form-group howmetpage">
    <label for="publicSize">
      Número de seguidores na sua principal rede social*
      <span class="message error message-inline" ng-if="showError('quizWhichPublic','required')">Obrigatório</span>
    </label>
  
    <label>
      <input type="radio" name="publicSize" required value="2500-" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">Até 2.500</span>
    </label>
    <label>
      <input type="radio" name="publicSize" required value="2501-5000" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">De 2.501 até 5.000</span>
    </label>
    <label>
      <input type="radio" name="publicSize" required value="5001-10000" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">De 5.001 até 10.000</span>
    </label>
    <label>
      <input type="radio" name="publicSize" required value="10001-50000" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">De 10.001 até 50.000</span>
    </label>
    <label>
      <input type="radio" name="publicSize" required value="50.001-100.000" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">De 50.001 até 100.000</span>
    </label>
    <label>
      <input type="radio" name="publicSize" required value="100.000+" ng-model="data.quiz.majorPublic.publicSize">
      <span class="small">Mais de 100.000</span>
    </label>
  </div>
  <div ng-include="templateButtons"></div>
</form>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/campaignCategories.html"><div class="form-group">
  <label>Marque as categorias de seu projeto:</label>
  <span class="message error message-inline" ng-show="Form.qtdCategoriesSelected.$error.maxSelection">Você ultrapassou a
    quantidade máxima de categorias</span>
  <div class="categories">
    <a class="category" ng-repeat="category in categories" ng-class="{selected:categoryIsSelected()}"
      ng-click="toggleCategory(Form)" title="{{category.title}}">
      <span>
        <i class="fa {{category.icon}}"></i>
        <small>{{category.title}}</small>
      </span>
    </a>
  </div>
  <input type="hidden" name="qtdCategoriesSelected" ng-model="qtdCategoriesSelected" max-selection="2">
</div>
</script>

  <div class="my-campaigns__campaign__metrics"
    ng-if='campaign.status === "published" && campaign.supports && isUserOwner(campaign)'>
    <div class="my-campaigns__campaign__metrics__total">
      <span class="my-campaigns__campaign__metrics__total__number">{{campaign.supports.total.value + campaign.otherSupports.value | numeral:'$0,0'}}</span>
      arrecadação estimada por {{frequency(campaign)}}</span>
      <div ng-if="campaign.goals.length > 0">
        <div class="progress-wrap">
          <div class="progress-bar" style="width: {{getGoalPercentage(campaign, getNextGoal(campaign).value)}}%">
          </div>
        </div>
        <div class="my-campaigns__campaign__metrics__goal">
          Meta: {{getNextGoal(campaign).value | numeral:'$0,0'}} por {{frequency(campaign)}}
          <span>({{getGoalPercentage(campaign, getNextGoal(campaign).value)}}% alcan&ccedil;ada)</span>
        </div>
      </div>
      <div class="my-campaigns__campaign__metrics__count">
        <img src="/img/profile/icon-people.png" class="icon-people">&nbsp;
        <span class="campaign-metrics-card__count__number">{{campaign.supports.total.count + campaign.otherSupports.count}}</span>&nbsp;pessoas
        apoiando
      </div>
    </div>
  </div>

    <script type="text/ng-template" id="/views/directives/user/campaign/config.html"><form name="Form" novalidate ng-submit="submit()">
  <div class="form-group" ng-if="data.campaign.fundingFrequency === 'recurring'">
    <label for="paywallAccessControl"><i class="fa fa-unlock-alt"></i> Funcionamento do Mural da campanha</label>
    <div class="inline-input">
      <div class="styled-radio">
        <div ng-class="{'styled-radio--selected': !data.campaign.retroactiveAccessControl}">
          <label>
            <input type="radio" ng-value="false" name="retroactiveAccessControl"
              ng-model="data.campaign.retroactiveAccessControl"> Acesso total às postagens
          </label>
          <div class="styled-radio--inside">
            <p>Um novo apoiador terá acesso imediato a <strong>todas as postagens</strong> já feitas em seu
              mural.*</p>
            <label>
              <div class="styled-radio__checkbox">
                <div>
                  <input type="checkbox" id="paywallAccessControl" name="paywallAccessControl"
                    ng-model="data.campaign.paywallAccessControl"
                    ng-disabled="disable() || data.campaign.retroactiveAccessControl">
                </div>
                <div>
                  Bloquear acesso de apoiadores(as)
                  que ainda não pagaram o apoio do mês atual**
                </div>
              </div>
            </label>
          </div>
        </div>
        <div ng-class="{'styled-radio--selected': data.campaign.retroactiveAccessControl}">
          <label>
            <input type="radio" ng-value="true" name="retroactiveAccessControl"
              ng-model="data.campaign.retroactiveAccessControl"> Acesso restrito às postagens
          </label>
          <div class="styled-radio--inside">
            <p>Um novo apoiador terá acesso <strong>somente as postagens</strong> dos meses em que o apoio foi pago.
              Postagens de meses anteriores ao seu apoio ficam bloqueadas***</p>
          </div>
        </div>
      </div>
      <small>*Sempre respeitando os níveis de apoio. Enquanto apoiador estiver ativo terá acesso às postagens feitas em
        seu
        mural.</small>
      <small>**Se marcada esta opção, apenas apoiadores com o pagamento no mês vigente confirmado conseguirão acessar as
        postagens em seu mural de campanha.</small>
      <small>***Sempre respeitando os níveis de apoio. Apoiador sempre terá acesso às postagens dos meses em que o
        apoio foi pago (enquanto a página da campanha estiver publicada).</small>
    </div>
  </div>
  <div class="form-group">
    <label for="campaignNSFW"><i class="fa fa-shield"></i> Informações de Segurança</label>
    <div class="inline-input">
      <label>
        <input type="checkbox" id="campaignNSFW" name="campaignNSFW" ng-model="data.campaign.explicit"
          ng-disabled="disable()">Conteúdo adulto<small>Marque aqui se o seu conteúdo pode vir a conter assuntos
          impróprios para menores ou nudez.</small>
      </label>
    </div>
    <div class="inline-input">
      <label>
        <input type="checkbox" id="politicallyExposedPerson" name="politicallyExposedPerson"
          ng-model="data.campaign.politicallyExposedPerson" ng-disabled="disable()">Sou Pessoa Politicamente Exposta
        <small>Marque se você tem essa condição. <a title="Pessoa Politicamente Exposta" data-balloon-length="xlarge"
            data-balloon="PPEs são pessoas que desempenham ou tenham desempenhado, nos últimos 5 anos, no Brasil ou no exterior, empregos ou funções públicas, assim como seus representantes, familiares (pais, filhos, cônjuges, companheiros e enteados) e outras pessoas de seu relacionamento próximo."
            data-balloon-pos="up">
            Saiba mais.
          </a>
        </small>
      </label>
    </div>
    <div class="inline-input">
      <label>
        <input type="checkbox" id="hideCampaignLocation" name="hideCampaignLocation"
          ng-model="data.campaign.hideLocation" ng-disabled="disable()">Esconder minha localização na página de Campanha
        <small>Sua cidade e seu Estado não serão mostrados na sua página de Campanha.
        </small>
      </label>
    </div>
  </div>
  
  <!-- <h4 style="color: rgb(10, 177, 10);" ng-show="isSmsBlocked()">Celular verificado</h4>

  <div>
    <div ng-if="!isNumberVerified" class="form-group">
      <div>
        <label for="contact" class="required">
          Contato da campanha
        </label>
        <div class="inline-input">
          <label>
            <small>Informe o celular do responsável pela administração da campanha.</small>
          </label>
        </div>
        <button class="mt-2 display-block" type="button" ng-click="smsValidationModal(data.campaign._id)">
          <span>Validar celular</span>
        </button>
      </div>
    </div>
  </div> -->
  
  <div class="ng-isolate-scope" style="display: inline;">
    <label for="tracking">Rastreios</label>
    <div class="grid ng-scope">
      <div class="grid__col grid__col--1-of-2">
        <div class="form-group">
          <label for="campaignPhoto">
            Facebook Pixel
            <span class="message error message-inline ng-hide" ng-show="showError('campaignPhoto', 'pattern')">
              O link deve começar com <b>https</b> e com a extenção <b>jpg, png ou gif</b>
            </span>
            <span class="message error message-inline ng-hide" ng-show="showError('campaignPhoto', 'sanitize')">Por
              motivos de segurança não podemos aceitar esse link. Por favor, tente outro.</span>
          </label>
          <div class="input-group">
            <input class="form-control ng-pristine ng-untouched ng-valid" id="fbPixelId" name="fbPixelId"
              ng-model="data.campaign.trackers.pixel" type="text" ng-disabled="disable()" placeholder="Seu Pixel ID"
              disabled="disabled">
          </div>
        </div>
      </div>
      <div class="grid__col grid__col--1-of-2">
        <div class="form-group">
          <label for="campaignPhoto">
            <span class="muted">Google Analytics ID</span> <span class="badge">em breve</span>
            <span class="message error message-inline ng-hide" ng-show="showError('gaId', 'pattern')">
              Use um ID válido, ex: <b>UA-XXXXXXXX-X</b>
            </span>
          </label>
          <div class="input-group">
            <input class="form-control ng-pristine ng-untouched ng-valid ng-valid-pattern" disabled="" id="gaId"
              name="gaId" ng-model="data.campaign.trackers.ga" type="text" pattern="(uA|Ua|UA|ua)-\d{4,9}-\d{1,4}$"
              placeholder="UA-XXXXXXXX-X">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div ng-if="!currentStep">
    <campaign-categories></campaign-categories>
    <span ng-if="data.campaign.terms.isTrue==false">
      <label>
        Termos
      </label>


      <div class="inline-input">
        <label><input type="checkbox" id="termsTrue" name="termsTrue" ng-model="data.campaign.terms.isTrue"
            ng-disabled="disable()" required>
          <span class="small">
            Declaro aqui sob as penas da lei que todos os dados aqui declarados são verídicos.</span>
        </label>
        <span class="message message-inline error" ng-show="showError('termsTrue','required')">Você precisa aceitar os
          termos</span>
      </div>
    </span>
  </div>

  <div ng-include="templateButtons"></div>
</form></script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/contentCard.html"><!-- CONTENT ACCESSIBLE -->
<div
  id="contentid-{{content.index}}"
  class="campaign-content-card"
  ng-class='{"campaign-content-card--not-allowed": !shouldDisplayContent(content, campaign, userSupport)}'
>
  <!-- CONTENT CARD HEADER -->
  <div class="campaign-content-card__header">
    <div class="campaign-content-card__avatar">
      <a
        ng-href="/{{campaign.slug}}"
        title="Ir para a página"
        ng-if="support.active"
      >
        <img src="{{campaign.about.photo|https}}" alt="{{campaign.name}}" />
      </a>
      <img
        src="{{campaign.about.photo|https}}"
        alt="{{campaign.name}}"
        ng-if="!support.active"
      />
    </div>
    <div class="campaign-content-card__info">
      <a
        class="campaign-content-card__name"
        ng-href="/{{campaign.slug}}"
        title="Ir para a página"
        ng-if="support.active"
      >
        {{campaign.name}}
      </a>
      <div class="campaign-content-card__name" ng-if="!support.active">
        {{campaign.name}}
      </div>
      <div class="campaign-content-card__date" ng-if="!content.scheduledDate && content.status!=='draft'">
        {{convertDate(content.date) | date:'dd MMM yyyy HH:mm'}}
      </div>
      <div class="campaign-content-card__date" ng-if="content.scheduledDate && content.status!=='draft'">
        {{convertDate(content.date) | date:'dd MMM yyyy HH:mm'}}
      </div>
      <div class="campaign-content-card__date" ng-if="content.status==='draft'">
        {{convertDate(content.createdAt) | date:'dd MMM yyyy HH:mm'}}
      </div>
    </div>
    <div class="campaign-content-card__statuses">
      <div
        class="campaign-content-card__status campaign-content-card__status--fixed"
        ng-if="content.scheduledDate && content.status === 'scheduled'"
      >
        <i
          class="fa fa-calendar-check-o"
          aria-hidden="true"
          alt="Post agendado"
          style="margin: 0 10px 0 0"
        ></i>
        Post agendado
      </div>
      <div
        class="campaign-content-card__status campaign-content-card__status--fixed"
        ng-if="content.pinned"
      >
        <img src="/img/profile/thumb-tack.png" alt="Post fixado" /> Post fixado
      </div>
      <div
        class="campaign-content-card__status campaign-content-card__status--public"
        ng-if="!content.isPaidFor && content.isPrivate"
      >
        <img src="/img/profile/lock.png" alt="Post exclusivo" /> Post exclusivo
      </div>
      <div
        class="campaign-content-card__status campaign-content-card__status--public"
        ng-if="!content.isPaidFor && !content.isPrivate"
      >
        <img src="/img/profile/unlock.png" alt="Post público" /> Post público
      </div>
      <div
        class="campaign-content-card__status campaign-content-card__status--private"
        ng-if="content.isPaidFor && content.isPrivate"
      >
        <img
          src="/img/profile/lock.png"
          alt="Post exclusivo pago por apoiadores(as)"
        />
        Pago por apoiadores(as)
      </div>
      <div
        class="campaign-content-card__status campaign-content-card__status--public"
        ng-if="content.isPaidFor && !content.isPrivate"
      >
        <img
          src="/img/profile/unlock.png"
          alt="Post público pago por apoiadores(as)"
        />
        Pago por apoiadores(as)
      </div>

    >

          version="1"
          width="27"
          height="27"
          viewBox="0 0 512 512"
        >
          <circle fill="currentColor" cx="256" cy="256" r="64" />
          <circle fill="currentColor" cx="256" cy="448" r="64" />
          <circle fill="currentColor" cx="256" cy="64" r="64" />
        </svg>
      </div>
      <div
        class="campaign-content-card__creator-menu__menu"
        ng-if="content.creatorMenuOpen"
      >
        <a ng-click="editContent(content, campaign)">
          Editar
        </a>
        <a ng-if="content.pinned" ng-click="pin(content.slug)">
          Desfixar
        </a>
        <a ng-if="!content.pinned" ng-click="pin(content.slug)">
          Fixar
        </a>
        <a ng-click="deleteContent(content.slug, content._id)">
          Excluir
        </a>

  <!-- IMG AREA -->
  <div ng-if="shouldDisplayContent(content, campaign, userSupport)">
    <figure
      class="campaign-content-card__photo"
      ng-if="content.photo"
      ng-click="go(campaign.slug, content.type, content.slug, content.index)"
    >
      <img
        imageonload="setFetched($index)"
        src="{{content.photo}}"
        alt="{{content.title}}"
        loading="lazy"
      />
    </figure>
    <figure
      class="campaign-content-card__photo campaign-content-card__photo--no-photo"
      ng-if="!content.photo"
      ng-click="go(campaign.slug, content.type, content.slug, content.index)"
    >
      <img
        imageonload="setFetched($index)"
        ng-src="{{content.data.images[0].url || campaign.about.photo}}"
        alt="{{content.title}}"
        loading="lazy"
      />
    </figure>
  </div>

  <div ng-if="!shouldDisplayContent(content, campaign, userSupport)">
    <figure class="campaign-content-card__photo">
      <img
        imageonload="setFetched($index)"
        src="{{campaign.about.photo|https}}"
        alt="{{content.title}}"
        loading="lazy"
      />

        <img
          src="/img/profile/lock-big.png"
          alt="Post exclusivo"
          width="29"
          height="36"
          loading="lazy"
        />
        <div ng-if="!shouldDisplayUnpaid(content)">
          <div ng-if="!isContentAvailable(content) || userSupport.isCanceled">
            <div class="campaign-content-card__photo__notice__title">
              <span>Post exclusivo para apoiadores(as)</span>
              <span ng-if="campaign.retroactiveAccessControl"
                >do mês de {{content.accrualMonth|moment:'MMMM [de]
                YYYY'}}</span
              >
            </div>
            <div ng-if="!campaign.retroactiveAccessControl">
              <div
                class="campaign-content-card__photo__notice__description"
                ng-if="!userSupport.isOverdue"
              >
                Ao apoiar
                <span
                  ng-if="!isPerContent() && !campaign.fundingFrequency=='oneTime'"
                  >mensalmente </span
                ><span ng-if="!content.isPaidFor && content.accessValue > 0"
                  >com R${{content.accessValue}} ou +</span
                >
                você poderá acessar e interagir com esta publicação.
                <div>
                  <div
                    class="campaign-content-card__photo__notice__support-button btn btn-support btn-support--new"
                    ng-click="support(campaign, content.accessValue)"
                  >
                    Apoie
                    <span ng-if="!content.isPaidFor && content.accessValue > 0"
                      >com R${{content.accessValue}} ou +</span
                    >
                    <span ng-if="content.isPaidFor || content.accessValue <= 0"
                      >essa iniciativa</span
                    >
                  </div>
                </div>
                <div
                  class="campaign-content-card__photo__notice__signup-link"
                  ng-if="!$root.currentUser"
                >
                  ou <a ui-sref="signin">acesse sua conta</a>
                </div>
              </div>
            </div>
            <div ng-if="campaign.retroactiveAccessControl">
              <div class="campaign-content-card__photo__notice__description">
                Somente quem apoiou
                <span ng-if="!content.isPaidFor && content.accessValue > 0"
                  >com R${{content.accessValue}} ou +</span
                >
                em {{content.accrualMonth|moment:'MMMM [de] YYYY'}} pode acessar
                e interagir com essa publicação.
              </div>
              <div ng-if="shouldDisplaySupportContent(content)">
                <div
                  class="campaign-content-card__photo__notice__support-button btn btn-support btn-support--new"
                  ng-click="support(campaign, content.accessValue)"
                >
                  Apoie
                  <span ng-if="!content.isPaidFor && content.accessValue > 0"
                    >com R${{content.accessValue}} ou +</span
                  >
                  <span ng-if="content.isPaidFor || content.accessValue <= 0"
                    >essa iniciativa</span
                  >
                </div>
              </div>
              <div
                class="campaign-content-card__photo__notice__signup-link"
                ng-if="!$root.currentUser"
              >
                <span ng-if="shouldDisplaySupportContent(content)">ou </span>
                <a ui-sref="signin">acesse sua conta</a>
              </div>
            </div>
          </div>
          <div ng-if="isContentAvailable(content) && userSupport.isOverdue">
            <div class="campaign-content-card__photo__notice__title">
              Post exclusivo para apoiadores(as)
            </div>
            <div class="campaign-content-card__photo__notice__description">
              Para acessá-lo, reative seus apoios.
              <div>
                <a
                  class="campaign-content-card__photo__notice__support-button btn btn-overhere btn-overhere--new"
                  href="/profile/supports"
                  scroll-next-page="#payout"
                >
                  Volte a apoiar!
                </a>
              </div>
            </div>
          </div>
        </div>
        <div ng-if="shouldDisplayUnpaid(content)">
          <div class="campaign-content-card__photo__notice__title">
            Acesso aguardando confirmação
          </div>
          <div class="campaign-content-card__photo__notice__description">
            O acesso a esta publicação será liberado assim que recebermos a
            confirmação de pagamento do seu apoio do mês atual.
            <br /><br />Pagamentos no cartão são compensados instantaneamente e
            no boleto de 1 à 3 dias. <br /><br />
            <a href="/profile/supports"
              >Altere o método de pagamento ou acesse seu boleto.</a
            >
          </div>
        </div>
      </div>
    </figure>
  </div>
  <!-- CONTENT CARD BODY -->
  <div class="campaign-content-card__body">
    <div
      class="campaign-content-card__title"
      ng-click="go(campaign.slug, content.type, content.slug, content.index)"
    >
      {{content.title}}
    </div>
    <div
      class="campaign-content-card__description"
      ng-if="shouldDisplayContent(content, campaign, userSupport)"
    >
      {{content.shortDescription}}
    </div>
    <div
      class="campaign-content-card__see-content"
      ng-if="shouldDisplayContent(content, campaign, userSupport)"
      ng-click="go(campaign.slug, content.type, content.slug, content.index)"
    >
      Ver post completo
      <img src="/img/profile/arrow-right.png" alt="Ver post completo" />
    </div>
    <div class="campaign-content-card__interaction">
      <div class="campaign-content-card__comments">
        <img src="/img/profile/bubble.png" alt="Comentários" />
        <facebook-comment-count
          url="/{{campaign.slug}}/contents/view/{{content.uuid}}"
        ></facebook-comment-count>
        &nbsp;comentários
      </div>
      <!-- botoes de interação curtir/compartilhar -->
      <div class="campaign-content-card__share">
        <a
          class="inline-block"
          data-balloon="Facebook"
          data-balloon-pos="up"
          target="_blank"
          href="https://www.facebook.com/sharer/sharer.php?u=https://apoia.se/{{campaign.slug}}/contents/view/{{content.slug}}"
        >
          <i class="fa fa-facebook"></i>
        </a>
        <a
          class="inline-block"
          data-balloon="Twitter"
          data-balloon-pos="up"
          target="_blank"
          href="https://twitter.com/intent/tweet?text={{content.title}}{{ getTwitterUsername(campaign) ? ' '+getTwitterUsername(campaign) : '' }}&url=https://apoia.se/{{campaign.slug}}/contents/view/{{content.slug}}&via=apoiase"
        >
          <i class="fa fa-twitter"></i>
        </a>
        <a
          target="_blank"
          data-balloon="Whatsapp"
          data-balloon-pos="up"
          target="_blank"
          href="https://api.whatsapp.com/send?text={{content.title}}%20https://apoia.se/{{campaign.slug}}/contents/view/{{content.slug}}"
        >
          <i class="fa fa-whatsapp"></i>
        </a>
      </div>
    </div>
  </div>
</div>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/countdown.html"><div class="campaign-countdown" ng-if="countdown.exists">

      </div>

    </div>
  </div>
</div>
