    <script type="text/ng-template" id="/views/directives/user/campaign/description.html"><form name="Form" novalidate ng-submit="submit()">

  <div class="form-group">
    <label for="campaignVideo">
      Vídeo de apresentação
      <span class="message error message-inline" ng-show="showError('campaignVideo', 'pattern')">O link deve começar com
        <b>https</b>
      </span>
      <span class="message error message-inline" ng-show="showError('campaignVideo', 'sanitize')">Por motivos de segurança não podemos aceitar esse link. Por favor, tente outro.</span>
      <small field-helper>Ponha no campo abaixo o link do seu vídeo do <u><b>Youtube</b></u> ou <u><b>Vimeo</b></u>.
        <br><u><b>- DICA 1</b></u>: Fazedores(as) com vídeo de apresentação aumentam muito as suas chances de obter apoios. Descubra mais lendo sobre <a href="https://blog.apoia.se/2017/08/23/a-importancia-do-video-de-apresentacao-e-descricao/?utm_source=wizard-da-APOIA-se" tabindex="-1" target="_blank">a importância do vídeo de apresentação</a>!
        
        <br><u><b>- DICA 2</b></u>: A APOIA.se é uma das plataformas habilitadas pelo Youtube como "Site externo atualmente suportados para captação
        de recursos". Ou seja, isso quer dizer que Fazedores(as) da APOIA.se podem colocar links (Youtube Cards) dizendo "clique aqui para apoiar a minha campanha" nos seus vídeos
         que seu público será direcionado para a sua página de campanha diretamente.
        <br><u><b>- DICA 3</b></u>: Se precisar do logotipo da APOIA.se em formato vetorial para utilizar na sua campanha, página ou vídeo é só baixar
        <a href="https://goo.gl/Avg4ct" tabindex="-1" target="_blank">neste link</a>.</small>
    </label>
    <div class="input-group">
      <input class="form-control" id="campaignVideo" name="campaignVideo" ng-model="data.campaign.about.video" require sanitize
        type="text" placeholder="https://" ng-disabled="disable()" pattern="^https\:\/\/.*\/.+$" ng-change="removeVideo()" />

    </div>
  </div>

  <div class="form-group">
    <label for="campaignDesc">
      Conte ao seu público quem voc&ecirc; &eacute;, o que voc&ecirc; faz e por que eles devem apoiá-lo.
      <span class="message error message-inline" ng-show="showError('goalDesc_'+$index,'required')">Descreva seu projeto</span>
      <small field-helper>Agora é hora de caprichar! Fale sobre o que você faz e sobre como você usará o dinheiro recebido na APOIA.se. O melhor é que seus potenciais apoiadores(as)
        ouçam sua mensagem através de um vídeo. E se quiser baixar o logotipo da APOIA.se em formato vetorial
        para utilizar na sua campanha, página ou video é só baixar <a href="https://goo.gl/Avg4ct" tabindex="-1" target="_blank">neste link</a>.
      </small>
    </label>
    <span class="message error message-inline" ng-show="showError('campaignDesc','required')">É necessário uma descrição da sua campanha</span>
    <div class="input-group">
      <input class="form-control" id="campaignDesc" name="campaignDesc" ng-model="data.campaign.about.desc" require type="hidden"
        required ng-disabled="disable()" />
      <div text-angular ta-toolbar="[['h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertLink','insertVideo','uploadImage']]"
        ng-model="data.campaign.about.desc"></div>
    </div>
  </div>

  <div id="turbo-message" ng-if="data.campaign.hasValidLinkedCampaign">
    <div class="warning-bar warning-turbo">
      <img src="/img/icons/attention.svg">
      <p class="warning-text">
        Campanhas Combinadas - Utilize o espaço abaixo para contar para seu público porque é importante apoiar ambas campanhas.
      </p>
    </div>

    <br>

    <div class="form-group">
      <div class="input-group">
        <input class="form-control" id="campaignDesc" name="campaignDesc" ng-model="data.campaign.turboCheckoutMessage" type="hidden"
          ng-disabled="disable()" />
        <div text-angular ta-toolbar="[['h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertLink','insertVideo','uploadImage']]"
          ng-model="data.campaign.turboCheckoutMessage"></div>
      </div>
    </div>
  </div>

  <div ng-include="templateButtons"></div>
</form>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/goals.html"><form name="Form" novalidate ng-submit="submit()">
  <div class="goal" ng-repeat="goal in data.campaign.goals">
    <div ng-if="goal">
        <h4> <i class="fa fa-star"></i> Meta
          {{goal.value|numeral:"$0,0"}}
          <a class="btn btn-new btn-xs btn-primary" ng-click="delete()">
            <i class="fa fa-trash"></i>
            Excluir
          </a>
        </h4>
        <div class="grid">
          <div class="grid__col grid__col--5-of-8">
            <div class="form-group">
              <label for="goalTitle_{{$index}}">
                T&iacute;tulo <span class="message error message-inline" ng-show="showError('goalTitle_'+$index,'required')">A meta precisa de um título</span>
              </label>
              <div class="input-group">
                <input class="form-control" id="goalTitle_{{$index}}" name="goalTitle_{{$index}}" ng-model="goal.title" require type="text" required ng-disabled="disable()" focus-me="!goal.title"></input>
              </div>
            </div>
          </div>
          <div class="grid__col grid__col--3-of-8">
            <div class="form-group">
              <label for="goalValue_{{$index}}">
                Valor (R$) <span class="message error" ng-show="showError('goalValue_'+$index)">A meta tem que ser maior que R$1</span>
              </label>
              <div class="input-group">
                <input class="form-control" id="goalValue_{{$index}}" name="goalValue_{{$index}}" ng-model="goal.value" require type="text" required ng-disabled="disable()" ui-money-mask="0" min=1></input>
              </div>
            </div>
          </div>
        </div>
        <div class="form-group">
          <label for="goalDesc_{{$index}}">
            Descri&ccedil;&atilde;o
            <span class="message error message-inline" ng-show="showError('goalDesc_'+$index,'required')">Descreva seu objetivo</span>
            <span class="message error message-inline" ng-show="showError('goalDesc_'+$index,'taMaxText')">A descrição deve ter um
              máximo de {{ descMaxLength }} caracteres.</span>
          </label>
          <div class="input-group">
            <input class="form-control" id="goalDesc_{{$index}}" name="goalDesc_{{$index}}" ng-model="goal.desc" ta-max-text="{{descMaxLength}}" require type="hidden" required ng-disabled="disable()"></input>
            <div text-angular ta-toolbar="[['h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertLink','insertVideo','uploadImage','charCount']]" ng-model="goal.desc"></div>
          </div>
        </div>
    </div>
  </div>
  <p>
    <button type="button" class="btn btn-new next" name="button" ng-disabled="disable()" ng-click="pushGoal()">
      <i class="fa fa-plus"></i> Adicionar uma nova meta</button>
  </p>

  <div ng-if="!campaignWasPublishedBefore && data.campaign.fundingFrequency === 'oneTime'">
    <h3 class="mb-2">
      Selecione a data de término da campanha
      <small>
        Recomendamos que sua campanha não ultrapasse 60 dias de duração. Após a publicação da campanha, não será possível alterar a data de término.
      </small>
    </h3>
    <div class="form-group">
      <div class="input-group">
        <input class="form-control" valid-date date-at-most-twelve-months-ahead name="dueDate" id="dueDate" placeholder="Ex: dd-mm-aaaa" ng-disabled="submiting" ng-model="data.campaign.dueDate" ui-date-mask="DD-MM-YYYY" parse="false" />
        <span class="message error message-inline" ng-show="showError('dueDate', 'validDate')">Data inválida</span>
        <span class="message error message-inline" ng-show="showError('dueDate', 'dateAtMostTwelveMonthsAhead')">Limite máximo de 12 meses</span>
      </div>
    </div>
  </div>
  <div ng-if="campaignWasPublishedBefore && data.campaign.fundingFrequency === 'oneTime'">
    <h3 class="mb-2">
      Data de término da campanha
      <small>
        Após a publicação da campanha, não é possível alterar a data de término.
      </small>
    </h3>
    <div class="form-group">
      <div class="input-group">
        <input class="form-control" disabled ng-model="data.campaign.dueDate" ui-date-mask="DD-MM-YYYY" parse="false" />
      </div>
    </div>
  </div>

  <div ng-include="templateButtons"></div>
</form>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/goalsCard.html"><div class="campaign-goals-card">
  <div ng-if="campaign.goals.length == 0">
    <div class="desc">
      Esta campanha ainda n&atilde;o definiu uma meta.
    </div>
  </div>
  <div ng-if="campaign.goals.length > 0">
    <div class="campaign-goals-card__header">
      <h3 class="campaign-goals-card__header__title" ng-if="campaign.goals.length == 1">META</h3>
      <h3 class="campaign-goals-card__header__title" ng-if="campaign.goals.length >= 2">METAS</h3>
      <div class="campaign-goals-card__header__slider" ng-if="campaign.goals.length >= 2">
        <div class="campaign-goals-card__header__slider__legend">
          {{campaignGoalsCard.activeGoalIndex + 1}} de {{campaign.goals.length}}
        </div>
        <div class="campaign-goals-card__header__slider__arrows">
          <div
            class="campaign-goals-card__header__slider__arrows__arrow"
            ng-click="setActiveGoal(campaignGoalsCard.activeGoalIndex-1)"
            ng-class='{"campaign-goals-card__header__slider__arrows__arrow--disabled": campaignGoalsCard.activeGoalIndex == 0}'
            >
            &lsaquo;
          </div>
          <div
            class="campaign-goals-card__header__slider__arrows__arrow"
            ng-click="setActiveGoal(campaignGoalsCard.activeGoalIndex+1)"
            ng-class='{"campaign-goals-card__header__slider__arrows__arrow--disabled": campaignGoalsCard.activeGoalIndex == (campaign.goals.length - 1)}'
            >
            &rsaquo;
          </div>
        </div>
      </div>
    </div>
    <div class="campaign-goals-card__goals">
      <div class="campaign-goals-card__goal">
        <div class="campaign-goals-card__goal__title">{{ campaignGoalsCard.activeGoal.title }}</div>
        <div ng-if="showAmountValues(campaign)">
          <div class="progress-wrap">
            <div class="progress-bar" style="width: {{ getGoalPercentage(campaign, campaignGoalsCard.activeGoal.value) }}%"></div>
          </div>
          <div class="campaign-goals-card__goal__value">
            R$ {{ campaignGoalsCard.activeGoal.value }}
            <span ng-if="isRecurring && !isScheduledSupport && !isPerContent()">por mês</span>
            <span ng-if="isPerContent()">por criação</span>
          </div>
        </div>
        <div class="campaign-goals-card__goal__desc" ta-bind ng-model="campaignGoalsCard.activeGoal.desc"></div>
      </div>
    </div>
  </div>
</div></script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/identity.html"><div class="campaign-identity" ng-if="campaign">
  <div class="campaign-identity__avatar-name-slogan">
    <div>
      <div class="avatar" ng-style='{"background-image": photo ? "url("+photo+")" : ""}' ng-if="!isMobile"></div>
    </div>
    <div class="name-slogan" ng-if="!isMobile">
      <a ng-href="/{{campaign.slug}}" target="_blank" rel="noopener noreferrer">
        <div class="name">{{campaign.name}}</div>
      </a>
      <div class="slogan">{{campaign.about.slogan ? campaign.about.slogan : campaign.desc}}</div>
    </div>
  </div>
  <div class="campaign-identity__goal__title" ng-if="campaign.goals.length > 0">
    <b>META:</b> {{getNextGoal(campaign).title}} 
    <span ng-if="showAmountValues(campaign)"> (R$ {{getNextGoal(campaign).value}} <span ng-if="isRecurring(campaign) && !campaign.isScheduledSupport && !isPerContent(campaign)">por mês</span>)</span>
  </div>
  <div class="campaign-identity__due-date" ng-if="isCountingDown(campaign)">
    <svg class="campaign-identity__due-date__icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 21" width="20" height="21">
      <path fill="#828282" d="M20 4.7L15.4 1l-1.3 1.5 4.6 3.8L20 4.7zM5.9 2.4L4.6.9 0 4.7l1.3 1.5 4.6-3.8zM10.5 7H9v6l4.8 2.8.7-1.2-4-2.3V7zM10 3a9 9 0 100 18 9 9 0 000-18zm0 16a7 7 0 110-14 7 7 0 010 14z" />
    </svg>
    <span ng-if="getDaysRemaining(campaign) > 1">
      {{getDaysRemaining(campaign) + ' dias restantes'}}
    </span>
    <span ng-if="getDaysRemaining(campaign) == 1">
      {{getDaysRemaining(campaign) + ' dia restante'}}
    </span>
    <span ng-if="getDaysRemaining(campaign) < 1">
      Último dia!
    </span>
  </div>

      <div class="campaign-identity__goal__percentage">

    </div>

          Apoiar com {{campaign.rewards|min:'value'|get:'value'|numeral:'$0'}} ou +

        <span ng-if="campaign.rewards.length <= 0">
          Apoiar agora

      </div>
    </div>
  </div>

    <script type="text/ng-template" id="/views/directives/user/campaign/info.html"><form name="Form" novalidate ng-submit="submit()" class="form-contact-address">
  <!-- Telefone -->
  <div class="grid">
    <div class="grid__col grid__col--6-of-8">
      <user-contact-fields address="data.personalAddress" contact="data.contact"></user-contact-fields>
    </div>
  </div>

  <hr>
  <div class="form-address-warning">
    ATENÇÃO: Você deve informar um endereço no Brasil para iniciar uma campanha.
  </div>
  <h4>Endere&ccedil;o</h4>

  <!-- Endereço -->
  <div class="grid">
    <div class="grid__col grid__col--6-of-8">
      <user-address-fields address="data.personalAddress"></user-address-fields>
    </div>
  </div>

  <div ng-include="templateButtons"></div>
</form>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/integrations.html"><form name="Form" novalidate ng-submit="submit()">
  <campaign-spotify-integration campaign='data.campaign' maker='maker'></campaign-spotify-integration>
  <hr />
  <campaign-discord-integration campaign='data.campaign' maker='maker'></campaign-discord-integration>
  <hr />
  <div ng-include="templateButtons"></div>
</form></script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/metricsCard.html"><div class="campaign-metrics-card">
  <div class="campaign-metrics-card__total">
    <div ng-if="showAmountValues(campaign)">
      <span class="campaign-metrics-card__total__number"
        >{{campaign.supports.total.value + campaign.otherSupports.value | numeral:'$0,0'}}</span
      >
      arrecadação estimada
      <span ng-show="isRecurring && !isScheduledSupport && !isPerContent()"
        >por mês</span
      >
      <span ng-show="isPerContent()">por criação</span>
      <div ng-if="campaign.goals.length > 0">
        <div class="progress-wrap">
          <div
            class="progress-bar"
            style="width: {{getGoalPercentage(campaign, getNextGoal(campaign).value)}}%"
          ></div>
        </div>
        <div class="campaign-metrics-card__goal">
          Meta: {{getNextGoal(campaign).value | numeral:'$0,0'}}
          <span ng-show="isRecurring && !isScheduledSupport && !isPerContent()"
            >por mês</span
          >
          <span ng-show="isPerContent()">por criação</span>
          <span
            >({{getGoalPercentage(campaign, getNextGoal(campaign).value)}}%
            alcan&ccedil;ada)</span
          >
        </div>
      </div>
    </div>
    <div
      class="campaign-metrics-card__count"
      ng-if="showSupportersNumber(campaign)"
    >
      <img src="/img/profile/icon-people.png" class="icon-people" />&nbsp;<span
        class="campaign-metrics-card__count__number"
        >{{campaign.supports.total.count + campaign.otherSupports.count}}</span
      >&nbsp;pessoas apoiando
    </div>
  </div>

  <div
    class="buttons buttons--action-triggers"
    ng-if="showCampaignClosedButton || showBlockedSupportButton"
  >
    <button
      id="overdueCampaignButton"
      class="buttons__button--disabled"
      type="button"
      ng-if="showCampaignClosedButton"
    >
      Campanha encerrada
    </button>

    <button
      type="button"
      class="buttons__button--disabled"
      type="button"
      ng-if="showBlockedSupportButton"
    >
      Apoio bloqueado, contate o fazedor.
    </button>
  </div>

  <div
    class="buttons buttons--action-triggers"
    ng-if="showSupportActionsButtons"
  >
    <button
      id="editSupportButton"
      class="btn btn-cancel"
      ng-click="support(campaign)"
      ng-if="showEditSupportButton"
    >
      Editar apoio
    </button>

    <button
      id="supportUserButton"
      ng-if="showSupportNowWithRecommendedRewardButton"
      class="btn btn-support no-animate btn-support--new"
      ng-click="support(campaign)"
    >
      <span ng-if="campaign.rewards.length > 0">
        Apoiar com {{campaign.rewards|min:'value'|get:'value'|numeral:'$0'}} ou
        +
      </span>
      <span ng-if="campaign.rewards.length <= 0">
        Apoiar agora
      </span>
    </button>
    <button
      id="supportUserButton"
      ng-if="showSupportNowWithoutRecommendedRewardButton"
      class="btn btn-support btn-support--new no-animate btn-support--preferential"
      ng-click="support(campaign, campaign.recommendedReward.value, false, false, true)"
    >
      Apoiar agora
    </button>

    <button
      id="reactivateSupportButton"
      ng-if="showReactivateSupportButton"
      class="btn btn-support btn-support--new"
      ng-click="support(campaign)"
    >
      Reativar apoio
    </button>
    <button
      id="cancelSupportButton"
      ng-if="showCancelSupportButton"
      class="btn btn-primary btn-primary--new"
      ng-click="cancelSupport(campaign.slug)"
    >
      Pausar apoio
    </button>
    <a
      class="btn btn-support"
      href="/support/{{campaign.slug}}/new"
      scroll-next-page="#payout"
      ng-if="showOverdueButton"
    >
      Volte a apoiar!
    </a>

          ng-if="campaign.fundingModel === 'allOrNothing'"

            ng-click="showCampaignTypeHelpModal('allOrNothing')"
          >
          Saiba mais
          </div>
        </div>

          class="campaign-metrics-card__campaign-type campaign-metrics-card__campaign-type--monthly"
          ng-if="isRecurring && !isScheduledSupport && !isPerContent()"

          <div
            class="campaign-metrics-card__campaign-type__help"
            ng-click="showCampaignTypeHelpModal('monthly')"
          >
            Saiba mais
          </div>
        </div>
        <div
          class="campaign-metrics-card__campaign-type campaign-metrics-card__campaign-type--turbo"
          ng-if="isRecurring && isScheduledSupport"
        >
          <div
            class="campaign-metrics-card__campaign-type__help"
            ng-click="showCampaignTypeHelpModal('turbo')"
          >
            Saiba mais
          </div>
        </div>
        <div
          class="campaign-metrics-card__campaign-type campaign-metrics-card__campaign-type--per-content"
          ng-if="isPerContent() && !isScheduledSupport"
        >
          <div
            class="campaign-metrics-card__campaign-type__help"
            ng-click="showCampaignTypeHelpModal('per-content')"
          >
            Saiba mais
          </div>
        </div>
        <div
          class="campaign-metrics-card__campaign-type campaign-metrics-card__campaign-type--one-time"
          ng-if="!isRecurring && campaign.fundingModel !== 'allOrNothing'"
        >
          <div
            class="campaign-metrics-card__campaign-type__help"
            ng-click="showCampaignTypeHelpModal('one-time')"
          >
            Saiba mais
          </div>
        </div>
      </div>
    </div>
    <hr />
    <div class="campaign-metrics-card__share">
      <span class="green">Ajude divulgando:</span>
      <a
        class="btn"
        target="_blank"
        href="https://api.whatsapp.com/send?text={{campaign.name}}%20https://apoia.se/{{campaign.slug}}"
      >
        <i class="fa fa-whatsapp"></i>
      </a>
      <a
        class="btn"
        target="_blank"
        href="https://www.facebook.com/sharer/sharer.php?u=https://apoia.se/{{campaign.slug}}"
      >
        <i class="fa fa-facebook-square"></i>
      </a>
      <a
        class="btn"
        target="_blank"
        href="https://twitter.com/intent/tweet?text={{campaign.name}}{{ getTwitterUsername(campaign) ? ' '+getTwitterUsername(campaign) : '' }}&url=https://apoia.se/{{campaign.slug}}&via=apoiase"
      >
        <i class="fa fa-twitter"></i>
      </a>
      <a class="btn" target="_blank" ng-click="copy()">
        <i class="fa fa-link"></i>
      </a>
    </div>
  </div>
</div>
</script>

</form>

    <script type="text/ng-template" id="/views/directives/user/campaign/rewards.html"><form name="Form" novalidate ng-submit="submit()">

  <div class="modal-backdrop" ng-if="showWarningModal">
    <div class="modal-alert-reward" role="document" ng-if="showWarningModal">
      <h4>Aviso</h4>
      <p>É necessário ter ao menos <strong>01</strong> recompensa cadastrada para habilitar a integração com o Spotify.</p>
      <button class="btn btn-primary" ng-click="closeWarningModal()">Manter recompensa</button>
      <button class="btn btn-primary" ng-click="delete(currentReward)">Excluir recompensa</button>
    </div>
  </div>

  <div class="reward" ng-repeat="reward in data.campaign.rewards">
    <h4>
      <i class="fa fa-star"></i>
      <span ng-if="!isPerContent()">Recompensa</span>
      <span ng-if="isPerContent()">Sugestão</span>
      {{reward.value|numeral:"$0,0"}}
      <a class="btn btn-new btn-xs btn-primary" ng-click="checkAndDeleteReward(reward)">
        <i class="fa fa-trash"></i>
        Excluir
      </a>
    </h4>

    <div class="grid">
      <div class="grid__col grid__col--5-of-8">
        <div class="form-group">
          <label for="rewardTitle_{{$index}}">
            T&iacute;tulo
          </label>
          <div class="input-group">
            <input class="form-control" id="rewardTitle_{{$index}}" name="rewardTitle_{{$index}}"
              ng-model="reward.title" type="text" ng-disabled="disable()" focus-me="!reward.title"></input>
          </div>
        </div>
      </div>
      <div class="grid__col grid__col--3-of-8">
        <div class="form-group">
          <label for="rewardValue_{{$index}}">
            Valor (R$)
            <span class="message error" ng-show="showError('rewardValue_'+$index, 'required')">Apoio com um valor mínimo
              de
              R$1</span>
            <span class="message error" ng-show="showError('rewardValue_'+$index, 'unique')">Já existe uma recompensa
              com este valor</span>
          </label>
          <div class="input-group">
            <input class="form-control" id="rewardValue_{{$index}}" name="rewardValue_{{$index}}"
              ng-model="reward.value" require type="text" required ng-disabled="disable()" ui-money-mask="0" min=1
              focus-me="!reward.desc" ng-change="parseRewardValue($index)"></input>
          </div>
        </div>
      </div>
    </div>


    <div class="form-group">
      <label for="rewardDesc_{{$index}}">
        Descri&ccedil;&atilde;o
        <span class="message error message-inline" ng-show="showError('rewardDesc_'+$index,'required')">Como você vai
          recompensar seu apoiador?</span>
        <span class="message error message-inline" ng-show="showError('rewardDesc_'+$index, 'taMaxText')">A descrição deve ter um
          máximo de {{ descMaxLength }} caracteres.</span>
      </label>
      <div class="input-group">
        <input class="form-control" ta-max-text="{{descMaxLength}}" id="rewardDesc_{{$index}}"
          name="rewardDesc_{{$index}}" ng-model="reward.desc" type="hidden" required ng-disabled="disable()"></input>
        <div text-angular
          ta-toolbar="[['h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertLink','insertVideo','uploadImage','charCount']]"
          ng-model="reward.desc"></div>
      </div>
    </div>
    <div class="inline-field">
      <label for="inform">Informações Adicionais</label>
      <div class="inline-field">
        <label>
          <input type="checkbox" ng-model="reward.physicalDelivery" id="physicalDelivery" name="physicalDelivery">
          Recompensa com entrega física
        </label>
      </div>
      <label ng-if="data.campaign.fundingFrequency === 'oneTime'">
        <input type="checkbox" ng-model="reward.limitedReward" id="limitedReward" name="limitedReward"
          ng-disabled="(reward.confirmed.length + reward.reserved.length > 0)"
          ng-change="refreshRewardLimitedNumber($index)">
        Recompensa limitada
        <small>Limitar o número de apoiadores que podem escolher essa recompensa</small>
      </label>
      <label ng-if="reward.limitedReward" for="rewardLimit_{{$index}}">
        <div class="grid">
          <div class="grid__col grid__col--1-of-8">
            <span class="message error" ng-if="reward.limitedReward && !reward.limitedNumber">É necessário definir um
              número limite ou desmarcar a recompensa como limitada</span>
            <span class="message error" ng-if="reward.limitedNumber" ng-show="showError('rewardLimit_'+$index)">Não é
              possível diminuir o número limite de recompensas</span>
            <div class="input-group">
              <input class="form-control" id="rewardLimit_{{$index}}" name="rewardLimit_{{$index}}"
                ng-model="reward.limitedNumber" type="number" required min=1
                ng-change="parseLimitedNumber($index)"></input>
            </div>
          </div>
          <div class="grid__col grid__col--7-of-8">
            <small>apoiadores(as) podem <br>escolher essa recompensa</small>
          </div>
        </div>
      </label>
    </div>
  </div>
  <p>
    <button type="button" class="btn btn-new next" name="button" ng-disabled="disable()" ng-click="pushReward()">
      <i class="fa fa-plus"></i> Adicionar uma nova
      <span ng-if="!isPerContent()">recompensa</span>
      <span ng-if="isPerContent()">sugestão</span>
    </button>
  </p>
  <p>
    <div class="input-group">
      <hr>
      <label>
        Apoio recomendado
        <small>
          Você pode selecionar uma
          <span ng-if="!isPerContent()">recompensa</span>
          <span ng-if="isPerContent()">sugestão</span>
          para aparecer de forma destacada em sua página de Campanha
        </small>
      </label>
      <p>
        <label class="normal-text-label">
          <input type="radio" ng-value="-1" name="recommendedReward" ng-click="setRecommendedReward(-1)"
            ng-model="recommendedRewardIndex">
          Não recomendar nenhuma
          <span ng-if="!isPerContent()">recompensa</span>
          <span ng-if="isPerContent()">sugestão</span>
          </br>
        </label>
        <label ng-repeat="reward in data.campaign.rewards" class="normal-text-label">
          <input type="radio" ng-value="$index" ng-model="recommendedRewardIndex" name="recommendedReward"
            ng-click="setRecommendedReward($index)">
          R${{reward.value}} - {{reward.title}}</br>
        </label>
      </p>
    </div>
  </p>
  <hr>

  <div id="welcome-message">
    <label>
      <input type="checkbox" id="campaignWelcome" name="campaignWelcome" ng-model="data.campaign.campaignWelcome"
        ng-click="removeMessage()">
      Mostrar mensagem de boas-vindas a novos(as) apoiadores(as)?
      <small>Personalize uma mensagem que será mostrada logo após o primeiro apoio</small>
    </label>

    <div class="form-group" ng-if="data.campaign.campaignWelcome">
      <label for="content" class="control-label">Link do vídeo de boas-vindas</label>
      <span class="message error message-inline" ng-show="showError('welcomeVideo', 'pattern')">Não é um link válido e/ou
        o link deve começar com
        <b>https</b>
      </span>
      <span class="message error message-inline" ng-show="showError('welcomeVideo', 'sanitize')">Por motivos de segurança
        não podemos aceitar esse link. Por favor, tente outro.</span>
      <input type="url" name="welcomeVideo" sanitize pattern="^https\:\/\/.*\/.+$" ng-model="data.campaign.welcomeVideo"
        id="content" class="form-control" placeholder="https://"></input><br>
      <label><small>Use a url inteira para o conteúdo incluindo o https://</small></label>

      <label for="welcomeMessage" class="control-label">Escreva abaixo sua mensagem de boas-vindas personalizada</label>
      <div text-angular
        ta-toolbar="[['p', 'h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertImage','insertLink','insertVideo', 'uploadImage']]"
        ng-model="data.campaign.welcomeMessage"></div>
    </div>
  </div>

  <div id="turbo-welcome-message" ng-if="data.campaign.hasValidLinkedCampaign">
    <div class="warning-bar warning-turbo">
      <img src="/img/icons/attention.svg">
      <p class="warning-text">
        Campanhas Combinadas - Mensagem de boas-vindas
      </p>
    </div>
    <br>

    <label>
      <input type="checkbox" id="turboCampaignWelcome" name="turboCampaignWelcome" ng-model="data.campaign.turboCampaignWelcome"
        ng-click="removeTurboMessage()">
        Mostrar mensagem de boas-vindas a novos(as) apoiadores(as) que apoiaram as duas campanhas?
      <small>Personalize uma mensagem que será mostrada logo após o apoio de quem apoiou as duas campanhas</small>
    </label>

    <div class="form-group" ng-if="data.campaign.turboCampaignWelcome">
      <label for="content" class="control-label">Link do vídeo de boas-vindas para quem apoiou as duas campanhas</label>
      <span class="message error message-inline" ng-show="showError('turboWelcomeVideo', 'pattern')">Não é um link válido e/ou
        o link deve começar com
        <b>https</b>
      </span>
      <span class="message error message-inline" ng-show="showError('turboWelcomeVideo', 'sanitize')">Por motivos de segurança
        não podemos aceitar esse link. Por favor, tente outro.</span>
      <input type="url" name="turboWelcomeVideo" sanitize pattern="^https\:\/\/.*\/.+$" ng-model="data.campaign.turboWelcomeVideo"
        id="content" class="form-control" placeholder="https://"></input><br>
      <label><small>Use a url inteira para o conteúdo incluindo o https://</small></label>

      <label for="turboWelcomeMessage" class="control-label">Escreva abaixo sua mensagem de boas-vindas personalizada para quem apoiou as duas campanhas</label>
      <div text-angular
        ta-toolbar="[['p', 'h1','h2','h3','bold','italics','underline','quote','ul','ol'],['justifyLeft','justifyCenter','justifyRight','insertImage','insertLink','insertVideo', 'uploadImage']]"
        ng-model="data.campaign.turboWelcomeMessage"></div>
    </div>
  </div>
  <hr>
  <div ng-include="templateButtons"></div>
</form>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/rewardsSection.html"><div class="campaign-rewards-section">
  <div ng-if="rewards.length == 0" class="campaign-rewards-section__empty">
    Esta campanha ainda n&atilde;o definiu nenhuma <span ng-if="isPerContent()">sugestão de apoio</span><span ng-if="!isPerContent()">recompensa</span>.
  </div>
  <div ng-if="rewards.length > 0" ng-init="setRewardCardsState()">
    <h3 class="campaign-rewards-section__title" ng-if="isPerContent()">Sugestões de apoio</h3>
    <h3 class="campaign-rewards-section__title" ng-if="!isPerContent()">Recompensas</h3>
    <div ng-repeat="reward in rewards track by $index" ng-form="formReward_{{$index}}" class="formReward_{{$index}}" ng-submit="preventPropagation($event)">
      <div ng-click="toggleRewardCard($index)" ng-class='{"campaign-rewards-section__reward--recommended": reward.recommended, "campaign-rewards-section__reward--open": reward.open, "campaign-rewards-section__reward--always-open": reward.alwaysOpen}' class="campaign-rewards-section__reward">
        <figure ng-if="reward.image" class="campaign-rewards-section__reward__picture">
          <img src="{{reward.image}}" alt="{{reward.title}}">
        </figure>
        <div class="campaign-rewards-section__reward__inner">
          <div class="campaign-rewards-section__reward__recommended-badge" ng-if="reward.recommended">
            Apoio recomendado!
          </div>
          <div class="campaign-rewards-section__reward__value" ng-if="!reward.noRewards">
            R$ {{reward.value}} ou mais
          </div>
          <div class="campaign-rewards-section__reward__value" ng-if="reward.noRewards">
            Sem recompensas
          </div>
          <div class="campaign-rewards-section__reward__title">
            {{reward.title}}
          </div>
          <div class="campaign-rewards-section__reward__description" ta-bind ng-model="reward.desc"></div>
          <div class="campaign-rewards-section__reward__see-more" ng-if="!reward.open && !reward.alwaysOpen && !reward.noRewards">Ver mais...</div>
          <br>
          <div class="campaign-rewards-section__reward__limit" ng-if="reward.limitedNumber">
            <div class="campaign-rewards-section__reward__limit__count campaign-rewards-section__reward__limit__count--sold-out" ng-if="reward.soldOut">
              <b>Esgotada</b>
            </div>
            <div class="campaign-rewards-section__reward__limit__count" ng-if="!reward.soldOut">
              <span ng-if="(reward.limitedNumber - (reward.confirmed.length+reward.reserved.length)===1)"><b>Limitada</b> ({{reward.limitedNumber - (reward.confirmed.length+reward.reserved.length)}} disponível)</span>
              <span ng-if="(reward.limitedNumber - (reward.confirmed.length+reward.reserved.length)>1)"><b>Limitada</b> ({{reward.limitedNumber - (reward.confirmed.length+reward.reserved.length)}} disponíveis)</span>
            </div>
            <div class="campaign-rewards-section__reward__supporters__count" ng-if="reward.confirmed.length">
              <span ng-if="(reward.confirmed.length)===1">{{reward.confirmed.length}} apoio confirmado</span>
              <span ng-if="(reward.confirmed.length)>1">{{reward.confirmed.length}} apoios confirmados</span>
            </div>
            <div class="campaign-rewards-section__reward__avaliable__count" ng-if="reward.reserved.length">
              <span ng-if="(reward.reserved.length)===1">{{reward.reserved.length}} apoio em prazo de confirmação</span>
              <span ng-if="(reward.reserved.length)>1">{{reward.reserved.length}} apoios em prazo de confirmação</span>
            </div>
          </div>
          <div ng-show="!rewards[$index].showSupportValue">
            <div class="campaign-rewards-section__reward__support-button" ng-click="showRewardCardSupportValue($event, $index)" ng-if="showSupportActionsButtons && !reward.soldOut">
              Apoiar<span ng-if="!reward.noRewards && !isPerContent()"> com esta recompensa</span>
            </div>
          </div>
          <div ng-show="rewards[$index].showSupportValue" ng-click="preventPropagation($event)" class="campaign-rewards-section__reward__support-value">
            <div class="campaign-rewards-section__reward__support-value__label">
              Digite o valor de apoio de R$ {{reward.value}} ou mais
            </div>
            <div class="campaign-rewards-section__reward__support-value__value-and-button">
              <div class="input-group">
                <span class="campaign-rewards-section__reward__support-value__value-and-button__value__adornment form-control campaign-rewards-section__reward__support-value__value-and-button__value__adornment__before">
                  R$
                </span>
                <span class="campaign-rewards-section__reward__support-value__value-and-button__value__adornment campaign-rewards-section__reward__support-value__value-and-button__value__adornment--small form-control campaign-rewards-section__reward__support-value__value-and-button__value__adornment__after" ng-if="isRecurring && !isPerContent() && !isScheduledSupport">
                  por mês
                </span>
                <span class="campaign-rewards-section__reward__support-value__value-and-button__value__adornment form-control campaign-rewards-section__reward__support-value__value-and-button__value__adornment__after" ng-if="!isRecurring || isPerContent() || isScheduledSupport">
                  ,00
                </span>
                <input class="form-control campaign-rewards-section__reward__support-value__value-and-button__value" required ng-model="supportValue" name="supportValue" min-max min="{{reward.value}}" max="{{reward.maxSupportValue}}" type="text" pattern="\d*" data-hj-whitelist />
                <span class="message error" ng-show="formReward_{{$index}}.supportValue.$error.pattern">Digite apenas números sem vírgulas</span>
                <span class="message error" ng-show="formReward_{{$index}}.supportValue.$error.required">Digite o valor de apoio corretamente</span>
                <span class="message error" ng-show="formReward_{{$index}}.supportValue.$error.min">O valor mínimo para apoio desta recompensa é de {{reward.value|numeral:'$0,0.00'}}</span>
                <span class="message error" ng-show="formReward_{{$index}}.supportValue.$error.max && formReward_{{$index}}.supportValue.$viewValue <= 10000">O valor máximo para apoio desta recompensa é de {{reward.maxSupportValue|numeral:'$0,0.00'}}</span>
                <span class="message error" ng-show="formReward_{{$index}}.supportValue.$viewValue > 10000">Para apoiar com mais de R$10000, entre em contato com o <a href="https://apoiase.zendesk.com/hc/pt-br/requests/new" target="_blank">suporte</a></span>
              </div>
              <div>
                <div class="campaign-rewards-section__reward__support-value__value-and-button__button" ng-click="supportFromReward(campaign, $index, $event, reward.noRewards, false, reward._id, true)"" ng-class="{'campaign-rewards-section__reward__support-value__value-and-button__button--disabled': isSupportValueButtonDisabled($index)}" ng-if=" showSupportActionsButtons && !reward.soldOut">
                  Continuar
                </div>
              </div>
            </div>
          </div>
          <div class="campaign-rewards-section__reward__support-button campaign-rewards-section__reward__support-button--disabled" ng-disabled=true ng-if="showSupportActionsButtons && reward.limitedNumber && reward.soldOut">
            Recompensa Esgotada
          </div>
        </div>
      </div>
    </div>
  </div>
</div></script>

          <div class="input-group">
            <input class="form-control" ng-maxlength="nameMaxLength" id="campaignName" name="campaignName"

            <span class="message error message-inline" ng-show="showError('campaignName', 'required')">O seu projeto

              ter no máximo {{nameMaxLength}} caracteres</span>
          </div>
        </div>
        <campaign-categories></campaign-categories>
        <div ng-if="data.campaign.fundingFrequency==='oneTime' && !isPublished" class="text-center">
          <label id="specialFee" for="specialFee">Escolha a taxa ideal para seu projeto pontual acontecer</label>
          <p class="text-center">
            A criação da campanha é gratuita. Por isso, escolha a taxa de serviço que será aplicada após o recebimento de apoios à sua campanha.
          </p>
          <select class="grid__col--1-of-8 fee-select" name="specialFee" id="specialFee"
            ng-options="option as option.name for option in availablePercentFees track by option.id"
            ng-model="selectedPercentFee" ng-change="updateSelectedFee(selectedPercentFee.value)"></select>
          <p class="margin-top">
            <b>Se todos escolhessem a mesma taxa que você:</b>
          </p>
          <div class="special-fee-warning special-fee-warning-red grid__col grid__col--6-of-8"
            ng-if="data.campaign.percentFee<8">
            <p>
              Aqui você já coloca a sua iniciativa no mundo, entretanto essa taxa não é financeiramente sustentável para tudo o que podemos te oferecer. Você terá o nosso apoio para uma campanha auto serviço e suporte técnico limitado a alguns assuntos, sem o auxílio de nossos Especialistas em Financiamento Coletivo para o atingimento da sua meta.
             </p>
          </div>
          <div class="special-fee-warning special-fee-warning-orange grid__col grid__col--6-of-8"
            ng-if="data.campaign.percentFee>=8 && data.campaign.percentFee<10">
            <p>
              Aqui já conseguimos estar um pouco mais próximos de você dando um suporte técnico essencial nas suas dúvidas e dos seus apoiadores. Com essa taxa conseguimos cobrir os custos básicos da nossa operação e manutenção da plataforma. Ainda teremos desafios para trabalhar com esse valor, mas se essa taxa for ideal para viabilizar seu projeto, conte conosco!
            </p>
          </div>
          <div class="special-fee-warning special-fee-warning-green grid__col grid__col--6-of-8"
            ng-if="data.campaign.percentFee==13">
            <p>
              Perfeito! Você entendeu a dinâmica do ganha-ganha! Aqui estamos mais próximos da sua campanha! Você pode contar com os nossos Especialistas em Financiamento Coletivo na construção de estratégias para atingir o sucesso da sua campanha e acesso ao nosso suporte técnico para suas dúvidas e dos seus apoiadores sempre que necessário. Essa taxa nos permite continuar melhorando a plataforma e impactando cada vez mais pessoas, assim como fazemos desde 2014.
            </p>
          </div>
          <div class="special-fee-warning special-fee-warning-dark-green grid__col grid__col--6-of-8"
            ng-if="data.campaign.percentFee>=14">
            <p>
              Uau! Você entendeu que compartilhar sucesso é o melhor caminho! Andaremos lado a lado contigo te auxiliando desde a criação, desenvolvimento de estratégias e ações para potencializar a arrecadação da sua campanha até o fim com atendimento personalizado do nosso time de Especialistas em Financiamento Coletivo e o nosso suporte técnico. Escolhendo essa taxa você possibilita que projetos mais necessitados sejam viabilizados pelo crowdfunding da APOIA.se e contribui ativamente para melhoria constante dos nossos produtos. Gratidão e abundância para você!
            </p>
          </div>
        </div>
        <!-- <span class="election-disclaimer">
          AVISO ELEIÇÕES 2022 - Atenção! A APOIA.se não tem registro junto ao TSE e por isso campanhas que tenham como
          objetivo <b>arrecadar recursos para qualquer fim eleitoral NÃO são permitidas.</b>
          <a href="https://www.tse.jus.br/eleicoes/eleicoes-2022/eleicoes-2022" target="_blank">Mais informações</a>.
        </span> -->
        <div ng-include="templateButtons"></div>
      </form>
    </div>
  </div>
</div>
</script>
  
    <script type="text/ng-template" id="/views/directives/user/campaign/wizard.html"><div class="steps" steps="10">

  <div class="step" ng-if="currentStep==1">
    <user-campaign-start></user-campaign-start>
  </div>

  <div class="step" ng-if="currentStep==2">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Informações básicas do projeto
          <small>Título, URL e redes sociais</small>
        </span>
      </h3>
      <user-campaign-about></user-campaign-about>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>

  </div>

  <div class="step" ng-if="currentStep==3">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Conte sua história
          <small>Descrição do projeto e vídeo contando sua história, dizendo o que você faz e quais são seus objetivos</small>
        </span>
      </h3>
      <user-campaign-description></user-campaign-description>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>

  </div>

  <div class="step" ng-if="currentStep==4">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Suas metas financeiras
          <small field-helper>
            <p>Metas financeiras podem ser POR MÊS ou PONTUAIS (segundo a modalidade de sua Campanha) e servem para ajudar você a alcançar os seus objetivos, deixando claro o que fará com o dinheiro
              recebido se atingir um determinado valor.</p>

            <p>Não são obrigatórias porém são altamente recomendáveis, pois "meta é um sonho com data de entrega" onde é você
              mesmo(a) que determina a data.</p>
              
            <p><b>- DICA 1</b>: Se você optar por estipular metas contínuas POR MÊS acesse nosso <a href="https://docs.google.com/spreadsheets/d/1Qzolh3sChMQygBXsY-JupezO45XCXLhYi32xdzd8bdg/copy" target="_blank">Gerador de Metas</a> para te auxiliar!</p></p> 
            <p><b>- DICA 2</b>: Sonhe alto, porém nós sempre recomendamos que os Fazedores(as) comecem estabelecendo metas de valor baixo, como se fossem "passos
              de bebê", pois quanto mais baixas e tangíveis forem as metas iniciais melhor para você e para o seu público
              que ganha otimismo ao ver as metas sendo atingidas. </p>
          </small>
      </h3>

      <user-campaign-goals></user-campaign-goals>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>

  </div>

  <div class="step" ng-if="currentStep==5">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Recompensas
        </span>
        <small field-helper>
          <p>Você precisa cadastrar ▶ PELO MENOS UMA RECOMPENSA ◀︎ com texto de descrição que pode ser
            simplesmente um agradecimento pelo apoio recebido. O valor mínimo que sua campanha estará apta a receber
            em cada apoio será o valor de sua menor recompensa.</p>
          <p>Nos não queremos que a oferta de recompensas seja um fardo para nossos Fazedores(as), então seja criativo
            e pense em oferecer recompensas fáceis de você escalar (oferecer em quantidade), que valham a pena do ponto de
            vista do custo-benefício e que sejam fáceis de cumprir.</p>
          <p><b>- Dica 1</b>: Como regra geral, a maioria dos apoios na APOIA.se ficam na média de R$20, por isso, recomendamos
            que você foque fortemente nas faixas de R$20, R$35 e R$50. Lembre-se que no caso das campanhas da modalidade CONTÍNUA o apoio é recorrente e é melhor você receber
            um apoio constante que não pese no bolso de sua base apoaidora! ; )</p>
          <p><b>- Dica 2</b>: Evite oferecer mais de 5 tipos de recompensas para evitar que os seus apoiadores travem no "<a href="https://www.ted.com/talks/barry_schwartz_on_the_paradox_of_choice?language=pt-br" target="_blank">Paradoxo da
            Escolha</a>" (vídeo de 15min). 
          </p>
          <p><b>- Dica 3</b>: Se for o caso, deixe claro que há uma quantidade limite para a recompensa em questão. (Ex.: limitado a 10
            apoiadores)
          </p>
          <p>
            <b>- Dica 4</b>: No caso de você querer oferecer recompensas materiais, procure deixar claro se a recompensa será entregue uma única
            vez quando o apoio for feito (por exemplo CDs, livros ou brindes como camisetas, bótons, etc). Já quando a recompensa
            for contínua cabe falar qual será a frequência de entrega. Procure evitar recompensas que o levem a deixar de
            criar conteúdo para ficar produzindo recompensas meramente. Privilegie sempre recompensas que estejam conectadas
            como um resultado natural da sua atividade fim (ex. produzir música, textos, quadrinhos, videos, etc) e nas quais
            o esforço despendido para a entrega seja proporcional ao valor do apoio recebido.</p>
          <p>
            <strong>Exemplos: </strong>
            <br> R$20 ou + ➤ Acesso à minha página de apoiadores + Será o primeiro a saber dos meus shows! :D
            <br> R$35 ou + ➤ As recompensas anteriores + Acesso a vídeos tutoriais exclusivos!
            <br> R$50 ou + ➤ Uma videochamada de 30 minutos por mês (limitado a 10 apoiadores)</p>
            <p>
            <strong>Alguns exemplos diretamente do blog da APOIA.se: </strong>
            <br><a href="https://blog.apoia.se/2018/07/15/11-estilos-de-recompensas-utilizadas-por-vloggers-cineastas-e-youtubers/?utm_source=wizard-da-APOIA-se" target="_blank">11 Estilos de Recompensas Utilizadas por Vloggers, Cineastas e Youtubers</a>
            <br><a href="https://blog.apoia.se/2018/07/24/10-estilos-de-recompensas-utilizadas-por-podcasters/?utm_source=wizard-da-APOIA-se" target="_blank">10 Estilos de Recompensas Utilizadas por Podcasters</a>
            <br><a href="https://blog.apoia.se/2018/07/09/7-estilos-de-recompensas-utilizadas-por-gamers/?utm_source=wizard-da-APOIA-se" target="_blank">7 Estilos de Recompensas Utilizadas por Gamers</a>
            <br><a href="https://blog.apoia.se/2018/08/09/12-estilos-de-recompensas-utilizadas-por-desenhistas-pintoresas-quadrinistas-e-ilustradoresas/?utm_source=wizard-da-APOIA-se" target="_blank">12 Estilos de Recompensas Utilizadas por Desenhistas, Pintores(as), Quadrinistas e Ilustradores(as)</a>
            <br><a href="https://blog.apoia.se/2018/09/11/12-estilos-de-recompensas-utilizadas-por-escritores-e-escritoras/?utm_source=wizard-da-APOIA-se" target="_blank">12 Estilos de Recompensas Utilizadas por Escritores e Escritoras</a>
            <br><a href="https://blog.apoia.se/2018/10/09/recompensas-para-ongs-de-animais/?utm_source=wizard-da-APOIA-se" target="_blank">6 Estilos de Recompensas Utilizadas por ONG’s de Animais</a>
          </p>
        </small>
      </h3>
      <user-campaign-rewards></user-campaign-rewards>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>
  </div>

  <div class="step" ng-if="currentStep==6">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Configurações
          <small>Preferências da campanha</small>
        </span>
      </h3>
      <user-campaign-config></user-campaign-config>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>

  </div>

  <div class="step" ng-if="currentStep==7">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Dados pessoais
          <small>Telefone e endereço</small>
        </span>
      </h3>
      <user-campaign-info></user-campaign-info>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>
  </div>

  <div class="step" ng-if="currentStep==8 && '!$rootScope.currentUser.simulated'">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Dados bancários
          <small>Informações de uma conta bancária onde a APOIA.se vai depositar os seus vencimentos. Você pode ter apenas uma conta bancária cadastrada na plataforma. Portanto, os dados bancários salvos serão utilizados para o recebimento dos apoios desta campanha e de outras que você tenha ou possa vir a ter e poderão ser editados  quando necessário.</small>
          <small>Saiba mais: <a href="https://apoiase.zendesk.com/hc/pt-br/articles/360055175091-Quais-documentos-s%C3%A3o-necess%C3%A1rios-para-iniciar-uma-campanha-" target="_blank">Quais documentos são necessários para iniciar uma campanha?</a></small>
        </span>
      </h3>
      <user-campaign-receipt></user-campaign-receipt>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>
  </div>

  <div class="step" ng-if="currentStep==9">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Ajude-nos a conhecer um pouco do seu universo
        </span>
      </h3>
      <form name="Form" novalidate ng-submit="submit()">
        <user-quiz-fields></user-quiz-fields>
        <div ng-include="templateButtons"></div>
      </form>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>
  </div>

  <div class="step" ng-if="currentStep==10">
    <div class="grid__col grid__col--2-of-12"></div>
    <div class="grid__col grid__col--8-of-12">
      <h3>
        <span class="wrap">
          <div class="where-am-i" ng-include="'where.html'"></div>
          Revisão e confirmação
        </span>
      </h3>
      <user-campaign-terms></user-campaign-terms>
    </div>
    <div class="grid__col grid__col--2-of-12"></div>
  </div>

</div>

<script type="text/ng-template" id="where.html">
    <span class="badge">{{currentStep}} de {{totalSteps}}</span>
</script>

<script type="text/ng-template" id="buttons.html">
    <div class="buttons welcome" ng-if="currentStep==1">
        <button type="submit" class="btn btn-new next" name="button" ng-disabled="disable()" 
                ng-class="{'btn-success':Form.$valid, 'btn-default':Form.$invalid, 'btn-loading':submiting}">
            Começar
            <i class="fa fa-play ml-1" ng-show="Form.$valid"></i>
            <i class="fa fa-times" ng-show="Form.$invalid"></i>
        </button>
    </div>
    <div class="buttons" ng-if="currentStep!==1">
            <div ng-show="Form.$invalid" class="info-form-invalid">
              Faltam algumas informações para <span class="glue">você prosseguir no cadastro.</span>
            </div>
            <a ng-click="prevStep()" class="prev buttons-campaign">
                <i class="fa fa-angle-left mr-1"></i> Voltar
            </a>
            <a ng-click="nextStep()" class="next jump buttons-campaign">
                <i class="fa fa-random"></i> Pular
            </a>
            <a href="{{url}}/{{campaign.slug}}" ng-if="campaign.slug" target="preview" class="next preview buttons-campaign">
                <i class="fa fa-eye"></i> Preview
            </a>
            <button type="submit" class="btn btn-new next" ng-class="{'btn-success':Form.$valid, 'btn-default':Form.$invalid}" name="button" ng-disabled="disableFormSubmit()" ng-class="{'btn-loading':submiting}">
                <i class="fa fa-check" ng-show="Form.$valid"></i>
                <i class="fa fa-times" ng-show="Form.$invalid"></i>
                {{textButtonSubmit}}</button>
        </div>
</script>
</script>
